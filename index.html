<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Red Thread Photobooth</title>
    <style>
        :root { --booth-red: #b31d1d; }

        body, html {
            margin: 0; padding: 0;
            height: 100%; width: 100%;
            background-color: #f2e1e1;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
            font-family: sans-serif;
        }

        /* This container mimics a phone screen to keep everything aligned */
        .main-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 500px; /* Adjust this to match your target phone width */
            aspect-ratio: 9/19.5; /* Modern phone ratio */
            background-color: #fff;
            overflow: hidden;
        }

        .screen {
            display: none;
            position: absolute;
            width: 100%; height: 100%;
            background-size: 100% 100%; /* Forces image to fill the container exactly */
            background-position: center;
            background-repeat: no-repeat;
        }
        
        .active { display: block; }

        /* Background Assets - Double check these filenames in your folder! */
        #screen-start { background-image: url('open%20scren.png'); }
        #screen-capture { background-image: url('photo%20screen.jpg'); }
        #screen-result { background-image: url('strip%20screen.jpg'); }

        /* CAMERA FIX: Precise Ratio & Positioning */
        .camera-viewport {
            position: absolute;
            top: 14%; /* Adjusted to match your red frame */
            left: 50%;
            transform: translateX(-50%);
            width: 68%; /* Matches the frame width in your design */
            height: 38%; /* Matches the frame height in your design */
            overflow: hidden;
            background: #000;
            border: 2px solid var(--booth-red);
            z-index: 5;
        }

        video {
            width: 100%; height: 100%;
            object-fit: cover; /* Prevents stretching */
            transform: scaleX(-1);
        }

        #timer {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 6rem; color: white; font-weight: bold;
            z-index: 10; text-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        /* THE BUTTON HIT ZONES */
        .hit-zone {
            position: absolute;
            cursor: pointer;
            z-index: 100;
            background: rgba(255, 0, 0, 0); /* Set to 0.2 to see them for testing */
        }

        #enter-btn { bottom: 5%; left: 10%; width: 80%; height: 12%; }

        /* RED START BUTTON: Fixed to the right-side control panel */
        #start-round-btn {
            top: 61.5%;
            right: 17%;
            width: 70px;
            height: 70px;
            border-radius: 50%;
        }

        .flash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 2000; display: none; }
    </style>
</head>
<body>

    <div id="flash" class="flash"></div>

    <div class="main-container">
        <div id="screen-start" class="screen active">
            <div id="enter-btn" class="hit-zone" onclick="initCamera()"></div>
        </div>

        <div id="screen-capture" class="screen">
            <div class="camera-viewport">
                <div id="timer"></div>
                <video id="video" autoplay playsinline></video>
            </div>
            <div id="start-round-btn" class="hit-zone" onclick="startBooth()"></div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const timer = document.getElementById('timer');

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                video.srcObject = stream;
                document.getElementById('screen-start').classList.remove('active');
                document.getElementById('screen-capture').classList.add('active');
            } catch (err) {
                alert("Please allow camera access and use HTTPS.");
            }
        }

        function startBooth() {
            let count = 3;
            timer.innerText = count;
            const interval = setInterval(() => {
                count--;
                if (count === 0) {
                    clearInterval(interval);
                    timer.innerText = "";
                    // Flash and Capture logic goes here
                    document.getElementById('flash').style.display = 'block';
                    setTimeout(() => { document.getElementById('flash').style.display = 'none'; }, 100);
                } else {
                    timer.innerText = count;
                }
            }, 1000);
        }
    </script>
</body>
</html>
