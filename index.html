<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Red Thread Photobooth</title>
    <style>
        :root { --booth-red: #b31d1d; }

        /* 1. RESET AND HIDE OVERFLOW */
        body, html {
            margin: 0; padding: 0;
            height: 100vh; width: 100vw;
            background-color: #f2e1e1;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }

        /* 2. BACKGROUND STYLING (The "Fix") */
        .screen { 
            display: none; 
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%; 
            background-size: contain; /* Shows whole image without cropping */
            background-position: center center;
            background-repeat: no-repeat;
            background-color: #f2e1e1; /* Fallback color */
        }
        
        /* Show screen when active */
        .active { display: block !important; }

        /* Assigning Backgrounds - Ensure these names match your files exactly */
        #screen-start { background-image: url('open scren.png'); }
        #screen-capture { background-image: url('photo screen.jpg'); }
        #screen-result { background-image: url('strip screen.jpg'); }

        /* 3. PHOTO RATIO: L 654,5307px X H 913,1924px */
        .camera-container {
            position: absolute;
            top: 13.5%; 
            left: 50%;
            transform: translateX(-50%); /* Centers the camera horizontally */
            width: 654.53px; 
            height: 913.19px;
            overflow: hidden;
            background: #000;
            z-index: 10; /* Keeps camera ABOVE background */
            border: 2px solid transparent; /* Helps define the edge */
        }

        video {
            width: 100%; height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Mirror effect */
        }

        #timer {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 10rem; color: white; font-weight: bold;
            z-index: 20;
            pointer-events: none;
            text-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* 4. BUTTON HIT ZONES */
        .hit-zone {
            position: absolute;
            cursor: pointer;
            z-index: 100;
            background: rgba(255, 0, 0, 0); /* Change to 0.3 for testing positions */
        }

        /* Start screen ENTER button */
        #enter-btn { 
            bottom: 5%; left: 50%;
            transform: translateX(-50%);
            width: 250px; height: 100px; 
        }

        /* Capture screen RED START button */
        #start-round-btn {
            bottom: 22%; right: 18%;
            width: 120px; height: 120px;
            border-radius: 50%;
        }

        .flash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 2000; display: none; }
    </style>
</head>
<body>

    <div id="flash" class="flash"></div>

    <div id="screen-start" class="screen active">
        <div id="enter-btn" class="hit-zone" onclick="initCamera()"></div>
    </div>

    <div id="screen-capture" class="screen">
        <div class="camera-container">
            <div id="timer"></div>
            <video id="video" autoplay playsinline></video>
        </div>
        <div id="start-round-btn" class="hit-zone" onclick="runSession()"></div>
    </div>

    <script>
        const video = document.getElementById('video');
        const timer = document.getElementById('timer');
        const flash = document.getElementById('flash');

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user' } 
                });
                video.srcObject = stream;
                
                // Switch screens
                document.getElementById('screen-start').classList.remove('active');
                document.getElementById('screen-capture').classList.add('active');
            } catch (err) {
                alert("Camera access failed. Ensure you use HTTPS.");
            }
        }

        async function runSession() {
            // Your countdown and capture logic
            console.log("Session started via Red Button");
        }
    </script>
</body>
</html>
