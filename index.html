<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>The Red Thread Photobooth</title>
    <style>
        * { box-sizing: border-box; }
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #f2e1e1; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }

        .app-container { 
            position: relative; 
            width: 100vw; height: 100vh; 
            max-width: 430px; max-height: 932px; 
            background-color: #f2e1e1; 
        }

        .screen { display: none; position: absolute; inset: 0; }
        .active { display: block !important; }
        .bg-layer { position: absolute; width: 100%; height: 100%; object-fit: contain; z-index: 1; }

        /* CAMERA SCREEN VIEWPORT */
        .camera-viewport {
            position: absolute; top: 11.5%; left: 50%; transform: translateX(-50%);
            width: 63%; height: 38%; overflow: hidden; background: #000; z-index: 5;
        }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

        /* STRIP SCREEN PREVIEW */
        .strip-preview-area {
            position: absolute; top: 5%; left: 50%; transform: translateX(-50%);
            width: 32%; height: 74.5%; z-index: 5;
            display: flex; flex-direction: column; align-items: center;
            padding-top: 2%;
        }
        .preview-img { 
            width: 88%; height: 17.6%; margin-bottom: 5.5%; 
            object-fit: cover; background: #fff; 
        }

        /* BUTTON HIT ZONES */
        .hitbox { position: absolute; z-index: 20; cursor: pointer; background: rgba(0,0,0,0); }
        #enter-btn { bottom: 5%; left: 50%; transform: translateX(-50%); width: 60%; height: 10%; }
        #start-btn { top: 58%; right: 15%; width: 22%; height: 12%; border-radius: 50%; }
        #ig-btn { bottom: 22%; left: 10%; width: 25%; height: 10%; }
        #dl-btn { bottom: 6%; left: 50%; transform: translateX(-50%); width: 80%; height: 8%; }

        #timer { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            font-size: 8rem; color: white; font-weight: bold; z-index: 100; 
            text-shadow: 0 0 20px #000; pointer-events: none;
        }
        .flash { position: fixed; inset: 0; background: white; z-index: 2000; display: none; }
    </style>
</head>
<body>

    <div id="flash" class="flash"></div>

    <div class="app-container">
        <div id="screen-1" class="screen active">
            <img src="open scren.png" class="bg-layer">
            <div id="enter-btn" class="hitbox" onclick="startCamera()"></div>
        </div>

        <div id="screen-2" class="screen">
            <img src="photo screen.png" class="bg-layer">
            <div class="camera-viewport">
                <div id="timer"></div>
                <video id="video" autoplay playsinline></video>
            </div>
            <div id="start-btn" class="hitbox" onclick="takeFourPhotos()"></div>
        </div>

        <div id="screen-3" class="screen">
            <img src="strip screen.png" class="bg-layer">
            <div class="strip-preview-area" id="preview-area"></div>
            <div id="ig-btn" class="hitbox" onclick="window.location.href='https://www.instagram.com/theredthread.app/'"></div>
            <div id="dl-btn" class="hitbox" onclick="generateMergedStrip()"></div>
        </div>
    </div>

    <canvas id="hidden-canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const timer = document.getElementById('timer');
        let capturedPhotos = [];

        async function startCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: 'user', aspectRatio: 3/4 } 
            });
            video.srcObject = stream;
            document.getElementById('screen-1').classList.remove('active');
            document.getElementById('screen-2').classList.add('active');
        }

        async function takeFourPhotos() {
            capturedPhotos = [];
            for (let i = 0; i < 4; i++) {
                await doCountdown(3);
                snap();
            }
            showResults();
        }

        function doCountdown(sec) {
            return new Promise(res => {
                let count = sec;
                timer.innerText = count;
                const interval = setInterval(() => {
                    count--;
                    if (count <= 0) { clearInterval(interval); timer.innerText = ""; res(); }
                    else { timer.innerText = count; }
                }, 1000);
            });
        }

        function snap() {
            document.getElementById('flash').style.display = 'block';
            setTimeout(() => document.getElementById('flash').style.display = 'none', 100);
            
            const c = document.createElement('canvas');
            c.width = 600; c.height = 800;
            const ctx = c.getContext('2d');
            ctx.translate(600, 0); ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0, 600, 800);
            capturedPhotos.push(c.toDataURL('image/jpeg', 0.9));
        }

        function showResults() {
            document.getElementById('screen-2').classList.remove('active');
            document.getElementById('screen-3').classList.add('active');
            const area = document.getElementById('preview-area');
            area.innerHTML = capturedPhotos.map(p => `<img src="${p}" class="preview-img">`).join('');
        }

        function generateMergedStrip() {
            const canvas = document.getElementById('hidden-canvas');
            const ctx = canvas.getContext('2d');
            const frame = new Image();
            frame.src = 'photo strip frame.png';

            frame.onload = () => {
                canvas.width = frame.width;
                canvas.height = frame.height;

                let imagesLoaded = 0;
                const imgs = capturedPhotos.map((src, i) => {
                    const img = new Image();
                    img.src = src;
                    img.onload = () => {
                        imagesLoaded++;
                        if (imagesLoaded === 4) {
                            // DRAW PHOTOS BEHIND
                            imgs.forEach((pImg, idx) => {
                                // EXACT ALIGNMENT MATH:
                                // Photo Width: 88% of frame
                                // Vertical spacing: idx * (19.5% of total height)
                                const w = canvas.width * 0.88;
                                const h = canvas.height * 0.176;
                                const x = (canvas.width - w) / 2;
                                const y = (canvas.height * 0.048) + (idx * (canvas.height * 0.198));
                                
                                ctx.drawImage(pImg, x, y, w, h);
                            });

                            // DRAW FRAME ON TOP
                            ctx.drawImage(frame, 0, 0);

                            // DOWNLOAD RESULT
                            const link = document.createElement('a');
                            link.download = 'RedThread_Strip.jpg';
                            link.href = canvas.toDataURL('image/jpeg', 0.95);
                            link.click();
                        }
                    };
                    return img;
                });
            };
        }
    </script>
</body>
</html>
