<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Red Thread Photobooth</title>
    <style>
        :root { --booth-red: #b31d1d; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; background-color: #f2e1e1; display: flex; justify-content: center; align-items: center; overflow: hidden; font-family: sans-serif; }

        .app-container { position: relative; width: 430px; height: 932px; background-color: #f2e1e1; overflow: hidden; }
        .screen { display: none; position: absolute; inset: 0; z-index: 1; }
        .active { display: block !important; }
        .bg-layer { position: absolute; width: 100%; height: 100%; object-fit: contain; z-index: 2; }

        /* Camera Frame Fix */
        .camera-viewport {
            position: absolute; top: 15.6%; left: 50%; transform: translateX(-50%);
            width: 255px; height: 350px; overflow: hidden; background: #222; z-index: 10;
        }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

        /* Result Strip Fix */
        .strip-overlay-container {
            position: absolute; top: 5.8%; left: 50%; transform: translateX(-50%);
            width: 135px; z-index: 10; display: flex; flex-direction: column; align-items: center;
        }
        .strip-photo { width: 110px; height: 145px; margin-bottom: 23px; object-fit: cover; background: #fff; }

        /* Invisible Hit Zones */
        .hit-zone { position: absolute; cursor: pointer; z-index: 100; }
        #enter-btn { bottom: 8%; left: 50%; transform: translateX(-50%); width: 200px; height: 80px; }
        #start-round-btn { top: 61.5%; right: 17%; width: 85px; height: 85px; border-radius: 50%; }
        #ig-link { bottom: 25.5%; left: 24%; width: 50px; height: 50px; }
        #dl-final { bottom: 9.5%; left: 50%; transform: translateX(-50%); width: 280px; height: 75px; }

        #timer { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 8rem; color: white; font-weight: bold; z-index: 20; text-shadow: 0 0 20px black; }
        .flash { position: fixed; inset: 0; background: white; z-index: 2000; display: none; }
    </style>
</head>
<body>

    <div id="flash" class="flash"></div>

    <div class="app-container">
        <div id="screen-start" class="screen active">
            <img src="open scren.png" class="bg-layer">
            <div id="enter-btn" class="hit-zone" onclick="initCamera()"></div>
        </div>

        <div id="screen-capture" class="screen">
            <img src="photo screen.png" class="bg-layer">
            <div class="camera-viewport"><div id="timer"></div><video id="video" autoplay playsinline></video></div>
            <div id="start-round-btn" class="hit-zone" onclick="startBoothSession()"></div>
        </div>

        <div id="screen-result" class="screen">
            <img src="strip screen.png" class="bg-layer">
            <div class="strip-overlay-container" id="final-strip-area"></div>
            <div id="ig-link" class="hit-zone" onclick="window.open('https://instagram.com/theredthread.app', '_blank')"></div>
            <div id="dl-final" class="hit-zone" onclick="saveFullStrip()"></div>
        </div>
    </div>

    <canvas id="merge-canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const timer = document.getElementById('timer');
        const flash = document.getElementById('flash');
        let sessionPhotos = [];

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 1280, height: 720 } });
                video.srcObject = stream;
                document.getElementById('screen-start').classList.remove('active');
                document.getElementById('screen-capture').classList.add('active');
            } catch (err) { alert("Enable camera access via HTTPS."); }
        }

        async function startBoothSession() {
            sessionPhotos = [];
            for (let i = 0; i < 4; i++) {
                await runCountdown(3);
                captureFrame();
            }
            document.getElementById('screen-capture').classList.remove('active');
            document.getElementById('screen-result').classList.add('active');
            renderPreview();
        }

        function runCountdown(sec) {
            return new Promise(resolve => {
                let timeLeft = sec; timer.innerText = timeLeft;
                const clock = setInterval(() => {
                    timeLeft--; if (timeLeft <= 0) { clearInterval(clock); timer.innerText = ""; resolve(); }
                    else { timer.innerText = timeLeft; }
                }, 1000);
            });
        }

        function captureFrame() {
            flash.style.display = 'block'; setTimeout(() => flash.style.display = 'none', 100);
            const tempCanvas = document.createElement('canvas');
            const ctx = tempCanvas.getContext('2d');
            tempCanvas.width = 600; tempCanvas.height = 800;
            ctx.translate(600, 0); ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0, 600, 800);
            sessionPhotos.push(tempCanvas.toDataURL('image/png'));
        }

        function renderPreview() {
            const container = document.getElementById('final-strip-area');
            container.innerHTML = sessionPhotos.map(data => `<img src="${data}" class="strip-photo">`).join('');
        }

        function saveFullStrip() {
            const canvas = document.getElementById('merge-canvas');
            const ctx = canvas.getContext('2d');
            const frameImg = new Image();
            frameImg.src = 'photo strip frame.png'; //

            frameImg.onload = function() {
                canvas.width = frameImg.width;
                canvas.height = frameImg.height;

                // 1. Draw Photos FIRST (Behind)
                sessionPhotos.forEach((data, i) => {
                    const img = new Image();
                    img.src = data;
                    img.onload = () => {
                        // These coordinates align with the boxes in your frame
                        ctx.drawImage(img, 45, 55 + (i * 185), 135, 165); 
                        if (i === 3) {
                            // 2. Draw Frame SECOND (On top)
                            ctx.drawImage(frameImg, 0, 0);
                            const link = document.createElement('a');
                            link.download = 'RedThread_Booth_Strip.png';
                            link.href = canvas.toDataURL('image/png');
                            link.click();
                        }
                    };
                });
            };
        }
    </script>
</body>
</html>
