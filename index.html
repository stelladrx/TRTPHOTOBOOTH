<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>The Red Thread Photobooth</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #f2e1e1; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }

        .app-container { 
            position: relative; 
            height: 100dvh; 
            aspect-ratio: 9 / 19.5; 
            background-color: #f2e1e1; 
            overflow: hidden;
        }

        .screen { display: none; position: absolute; inset: 0; }
        .active { display: block !important; }
        .bg-layer { position: absolute; width: 100%; height: 100%; object-fit: contain; z-index: 1; }

        /* CAMERA VIEWPORT */
        .camera-viewport {
            position: absolute; top: 16%; left: 50%; transform: translateX(-50%);
            width: 62%; height: 35%; overflow: hidden; background: #000; z-index: 5;
            border-radius: 4px;
        }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

        /* STRIP PREVIEW */
        .strip-preview-area {
            position: absolute; 
            top: 10%; 
            left: 38%; /* Moved left to make room for the Instagram button */
            transform: translateX(-50%);
            width: 32%; 
            height: auto;
            z-index: 5;
            background: white; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 10px 0;
        }
        
        .preview-photos-container {
            width: 100%; display: flex; flex-direction: column; align-items: center;
            gap: 5px;
        }

        .preview-img { 
            width: 88%; height: auto; aspect-ratio: 1000 / 750;
            object-fit: cover; z-index: 2;
        }

        .preview-trt-logo { 
            position: absolute; top: 40.5%; width: 35%; z-index: 10; 
        }

        .preview-text-logo { 
            width: 82%; margin-top: 8px; padding-bottom: 5px; 
        }

        /* HIT ZONES */
        .hitbox { position: absolute; z-index: 20; cursor: pointer; }
        #enter-btn { bottom: 6%; left: 50%; transform: translateX(-50%); width: 60%; height: 10%; }
        #start-btn { top: 58%; right: 14%; width: 22%; height: 12%; }
        
        /* Tag Us Button - Now next to the strip */
        #ig-btn { top: 35%; left: 78%; transform: translateX(-50%); width: 25%; height: 10%; }
        
        /* Buttons moved higher */
        #dl-btn { bottom: 12%; left: 50%; transform: translateX(-50%); width: 80%; height: 7%; }
        #retake-btn { 
            bottom: 6%; left: 50%; transform: translateX(-50%); 
            width: 50%; height: 4%; 
            display: flex; justify-content: center; align-items: center;
            font-family: sans-serif; font-weight: bold; font-size: 11px; color: #b31d1d;
            text-decoration: underline;
        }

        #timer { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            font-size: 5rem; color: white; font-weight: bold; z-index: 100; 
        }
        .flash { position: fixed; inset: 0; background: white; z-index: 2000; display: none; }
    </style>
</head>
<body>

    <div id="flash" class="flash"></div>

    <div class="app-container">
        <div id="screen-1" class="screen active">
            <img src="open scren.png" class="bg-layer">
            <div id="enter-btn" class="hitbox" onclick="startCamera()"></div>
        </div>

        <div id="screen-2" class="screen">
            <img src="photo screen.png" class="bg-layer">
            <div class="camera-viewport">
                <div id="timer"></div>
                <video id="video" autoplay playsinline></video>
            </div>
            <div id="start-btn" class="hitbox" onclick="takeFourPhotos()"></div>
        </div>

        <div id="screen-3" class="screen">
            <img src="strip screen.png" class="bg-layer">
            <div class="strip-preview-area">
                <div class="preview-photos-container" id="photo-list"></div>
                <img src="TRT LOGO.png" class="preview-trt-logo">
                <img src="text logo.png" class="preview-text-logo">
            </div>
            <div id="ig-btn" class="hitbox" onclick="window.location.href='https://instagram.com/theredthread.app'"></div>
            <div id="dl-btn" class="hitbox" onclick="createFinalDownload()"></div>
            <div id="retake-btn" class="hitbox" onclick="location.reload()">RETAKE PHOTOS</div>
        </div>
    </div>

    <canvas id="hidden-canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const timer = document.getElementById('timer');
        let capturedPhotos = [];

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                video.srcObject = stream;
                document.getElementById('screen-1').classList.remove('active');
                document.getElementById('screen-2').classList.add('active');
            } catch (err) { alert("Camera access required."); }
        }

        async function takeFourPhotos() {
            capturedPhotos = [];
            for (let i = 0; i < 4; i++) {
                await doCountdown(3);
                snap();
            }
            showResults();
        }

        function doCountdown(sec) {
            return new Promise(res => {
                let count = sec; timer.innerText = count;
                const clock = setInterval(() => {
                    count--;
                    if (count <= 0) { clearInterval(clock); timer.innerText = ""; res(); }
                    else { timer.innerText = count; }
                }, 1000);
            });
        }

        function snap() {
            document.getElementById('flash').style.display = 'block';
            setTimeout(() => document.getElementById('flash').style.display = 'none', 100);
            const c = document.createElement('canvas');
            c.width = 1000; c.height = 750;
            const ctx = c.getContext('2d');
            ctx.translate(1000, 0); ctx.scale(-1, 1);
            
            const vWidth = video.videoWidth;
            const vHeight = video.videoHeight;
            const targetRatio = 1000 / 750;
            let sW = vWidth, sH = vHeight, sx = 0, sy = 0;
            if (vWidth / vHeight > targetRatio) { sW = vHeight * targetRatio; sx = (vWidth - sW) / 2; }
            else { sH = vWidth / targetRatio; sy = (vHeight - sH) / 2; }

            ctx.drawImage(video, sx, sy, sW, sH, 0, 0, 1000, 750);
            capturedPhotos.push(c.toDataURL('image/jpeg', 0.95));
        }

        function showResults() {
            document.getElementById('screen-2').classList.remove('active');
            document.getElementById('screen-3').classList.add('active');
            document.getElementById('photo-list').innerHTML = capturedPhotos.map(p => `<img src="${p}" class="preview-img">`).join('');
        }

        function createFinalDownload() {
            const canvas = document.getElementById('hidden-canvas');
            const ctx = canvas.getContext('2d');
            
            // Increased canvas height slightly to ensure NO overlap
            canvas.width = 1200;
            canvas.height = 3650; 

            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const trtLogo = new Image(); trtLogo.src = 'TRT LOGO.png';
            const textLogo = new Image(); textLogo.src = 'text logo.png';

            let loaded = 0;
            const imgs = capturedPhotos.map(src => {
                const img = new Image(); img.src = src;
                img.onload = () => { loaded++; if(loaded === 4) build(); };
                return img;
            });

            function build() {
                const photoW = 1050; const photoH = 787;
                const x = (canvas.width - photoW) / 2;
                
                imgs.forEach((img, i) => {
                    const y = 80 + (i * 810);
                    ctx.drawImage(img, x, y, photoW, photoH);
                });

                const trtSize = 360;
                ctx.drawImage(trtLogo, (canvas.width/2)-(trtSize/2), 1500, trtSize, trtSize);

                // TEXT LOGO Y-POSITION: Placed explicitly AFTER the 4th photo's bottom edge
                // 4th photo ends at: 80 + (3 * 810) + 787 = 3300ish
                const txtW = 950; const txtH = 200;
                const textLogoY = 3350; // Guaranteed space after the photos
                ctx.drawImage(textLogo, (canvas.width/2)-(txtW/2), textLogoY, txtW, txtH);

                const link = document.createElement('a');
                link.download = 'RedThread_Strip.jpg';
                link.href = canvas.toDataURL('image/jpeg', 1.0);
                link.click();
            }
        }
    </script>
</body>
</html>
