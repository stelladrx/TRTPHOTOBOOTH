<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Red Thread Photobooth</title>
    <style>
        :root { --booth-red: #b31d1d; }

        body, html {
            margin: 0; padding: 0;
            height: 100%; width: 100%;
            background-color: #f2e1e1;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }

        /* This container forces the phone aspect ratio to stop stretching */
        .app-container {
            position: relative;
            width: 430px; 
            height: 932px; 
            background-color: #ffffff;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .screen {
            display: none;
            position: absolute;
            inset: 0;
            z-index: 1;
        }
        
        .active { display: block !important; }

        /* The Background Layer */
        .bg-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: contain; /* Keeps your drawing from stretching */
            z-index: 2;
        }

        /* CAMERA: Centered in your red box drawing */
        .camera-viewport {
            position: absolute;
            top: 15.3%; /* Adjusted based on your photo screen.jpg */
            left: 50%;
            transform: translateX(-50%);
            width: 280px; 
            height: 380px;
            overflow: hidden;
            background: #222;
            z-index: 10;
            border: 2px solid var(--booth-red);
        }

        video {
            width: 100%; height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        /* INVISIBLE BUTTONS */
        .hit-zone {
            position: absolute;
            cursor: pointer;
            z-index: 100;
            background: rgba(255, 0, 0, 0); /* Set to 0.3 to see where to click */
        }

        /* Screen 1: ENTER */
        #enter-btn { 
            bottom: 60px; left: 50%; 
            transform: translateX(-50%); 
            width: 250px; height: 100px; 
        }

        /* Screen 2: RED CIRCLE START */
        #start-round-btn { 
            top: 61.5%; right: 18%; 
            width: 80px; height: 80px; 
            border-radius: 50%; 
        }

        #timer {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 8rem; color: white; font-weight: bold;
            z-index: 20; text-shadow: 0 0 20px black;
        }

        .flash { position: fixed; inset: 0; background: white; z-index: 2000; display: none; }
    </style>
</head>
<body>

    <div id="flash" class="flash"></div>

    <div class="app-container">
        
        <div id="screen-start" class="screen active">
            <img src="open scren.png" class="bg-layer" onerror="this.style.background='red'; alert('Missing: open scren.png')">
            <div id="enter-btn" class="hit-zone" onclick="initCamera()"></div>
        </div>

        <div id="screen-capture" class="screen">
            <img src="photo screen.jpg" class="bg-layer" onerror="this.style.background='red'; alert('Missing: photo screen.jpg')">
            <div class="camera-viewport">
                <div id="timer"></div>
                <video id="video" autoplay playsinline></video>
            </div>
            <div id="start-round-btn" class="hit-zone" onclick="runSession()"></div>
        </div>

    </div>

    <script>
        const video = document.getElementById('video');
        const timer = document.getElementById('timer');

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user' } 
                });
                video.srcObject = stream;
                document.getElementById('screen-start').classList.remove('active');
                document.getElementById('screen-capture').classList.add('active');
            } catch (err) {
                alert("Please check: 1. You are on HTTPS. 2. Camera permission is allowed.");
            }
        }

        function runSession() {
            let count = 3;
            timer.innerText = count;
            const clock = setInterval(() => {
                count--;
                if (count <= 0) {
                    clearInterval(clock);
                    timer.innerText = "";
                    document.getElementById('flash').style.display = 'block';
                    setTimeout(() => { document.getElementById('flash').style.display = 'none'; }, 100);
                } else {
                    timer.innerText = count;
                }
            }, 1000);
        }
    </script>
</body>
</html>
