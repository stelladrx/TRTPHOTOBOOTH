<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Red Thread Photobooth</title>
    <style>
        :root { --booth-red: #b31d1d; }

        body, html {
            margin: 0; padding: 0;
            height: 100%; width: 100%;
            background-color: #f2e1e1;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }

        /* Essential: This keeps your backgrounds visible and centered */
        .screen { 
            display: none; 
            position: relative;
            width: 100vw; 
            height: 100vh; 
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
        }
        
        .active { display: flex; flex-direction: column; align-items: center; }

        /* Background Assets */
        #screen-start { background-image: url('open scren.png'); }
        #screen-capture { background-image: url('photo screen.jpg'); }
        #screen-result { background-image: url('strip screen.jpg'); }

        /* CAMERA RATIO FIX: L 654,5307px X H 913,1924px */
        .camera-container {
            position: absolute;
            top: 13.5%; /* Adjusted to sit inside the red frame */
            width: 654.53px; 
            height: 913.19px;
            overflow: hidden;
            background: #000;
            z-index: 5;
            /* Ensures it stays proportionate on smaller screens */
            transform-origin: top center;
            zoom: 0.45; /* Adjust this zoom value if the camera looks too big/small on your screen */
        }

        video {
            width: 100%; height: 100%;
            object-fit: cover; /* Forces the video to fill the 654x913 area */
            transform: scaleX(-1);
        }

        #timer {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 15rem; color: white; font-weight: bold;
            z-index: 10;
            pointer-events: none;
        }

        /* Strip Result Slots */
        .results-overlay {
            position: absolute;
            top: 5%;
            width: 320px; 
            height: 1100px;
            display: flex; flex-direction: column;
            justify-content: space-between;
            padding: 15px 0;
            z-index: 5;
            zoom: 0.5;
        }

        .photo-slot { width: 100%; height: 23.5%; overflow: hidden; }
        .photo-slot img { width: 100%; height: 100%; object-fit: cover; }

        /* BUTTONS (HIT ZONES) */
        .hit-zone {
            position: absolute;
            cursor: pointer;
            z-index: 100;
            background: rgba(255, 0, 0, 0); /* Invisible */
        }

        /* ENTER Button on Start Screen */
        #enter-btn { 
            bottom: 5%; 
            width: 250px; 
            height: 100px; 
        }

        /* RED ROUND START BUTTON: Positioned over your drawing */
        #start-round-btn {
            bottom: 22%; 
            right: 18%;
            width: 120px; 
            height: 120px;
            border-radius: 50%;
        }

        /* Result Screen Buttons */
        #instagram-hit { bottom: 20%; left: 12%; width: 80px; height: 80px; }
        #download-hit { bottom: 7%; width: 300px; height: 80px; }

        .flash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 2000; display: none; }
    </style>
</head>
<body>

    <div id="flash" class="flash"></div>

    <div id="screen-start" class="screen active">
        <div id="enter-btn" class="hit-zone" onclick="initCamera()"></div>
    </div>

    <div id="screen-capture" class="screen">
        <div class="camera-container">
            <div id="timer"></div>
            <video id="video" autoplay playsinline></video>
        </div>
        <div id="start-round-btn" class="hit-zone" onclick="runSession()"></div>
    </div>

    <div id="screen-result" class="screen">
        <div class="results-overlay">
            <div id="p1" class="photo-slot"></div>
            <div id="p2" class="photo-slot"></div>
            <div id="p3" class="photo-slot"></div>
            <div id="p4" class="photo-slot"></div>
        </div>
        <div id="instagram-hit" class="hit-zone" onclick="window.open('http://www.instagram.com/theredthread.app')"></div>
        <div id="download-hit" class="hit-zone" onclick="exportStrip()"></div>
        <button style="position:absolute; top: 20px; right: 20px; z-index: 1000;" onclick="location.reload()">RETRY</button>
    </div>

    <canvas id="hidden-canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const timer = document.getElementById('timer');
        const flash = document.getElementById('flash');
        let captured = [];

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user', width: 1280, height: 720 } 
                });
                video.srcObject = stream;
                document.getElementById('screen-start').classList.remove('active');
                document.getElementById('screen-capture').classList.add('active');
            } catch (err) {
                alert("Camera Error: Please use HTTPS and allow camera access.");
            }
        }

        async function runSession() {
            document.getElementById('start-round-btn').style.pointerEvents = 'none';
            captured = [];
            for (let i = 1; i <= 4; i++) {
                await doCountdown(3);
                triggerFlash();
                snap(i);
            }
            document.getElementById('screen-capture').classList.remove('active');
            document.getElementById('screen-result').classList.add('active');
        }

        function doCountdown(s) {
            return new Promise(res => {
                let count = s;
                timer.innerText = count;
                const clock = setInterval(() => {
                    count--;
                    if (count <= 0) { clearInterval(clock); timer.innerText = ""; res(); }
                    else { timer.innerText = count; }
                }, 1000);
            });
        }

        function triggerFlash() {
            flash.style.display = 'block';
            setTimeout(() => flash.style.display = 'none', 100);
        }

        function snap(index) {
            const canvas = document.getElementById('hidden-canvas');
            const ctx = canvas.getContext('2d');
            // Logic to capture at your exact required dimensions
            canvas.width = 654.53; 
            canvas.height = 913.19;
            ctx.translate(canvas.width, 0); ctx.scale(-1, 1);
            
            const scale = Math.max(canvas.width / video.videoWidth, canvas.height / video.videoHeight);
            const x = (canvas.width / 2) - (video.videoWidth / 2) * scale;
            const y = (canvas.height / 2) - (video.videoHeight / 2) * scale;
            ctx.drawImage(video, x, y, video.videoWidth * scale, video.videoHeight * scale);
            
            const data = canvas.toDataURL('image/png');
            captured.push(data);
            document.getElementById('p' + index).innerHTML = `<img src="${data}">`;
            ctx.setTransform(1, 0, 0, 1, 0, 0);
        }

        async function exportStrip() {
            const exp = document.createElement('canvas');
            const ctx = exp.getContext('2d');
            exp.width = 600; exp.height = 1800;
            const frame = new Image();
            frame.src = 'photo strip frame.png';
            for (let i = 0; i < 4; i++) {
                const img = new Image();
                img.src = captured[i];
                await img.decode();
                ctx.drawImage(img, 72, 100 + (i * 418), 456, 332);
            }
            await frame.decode();
            ctx.drawImage(frame, 0, 0, 600, 1800);
            const link = document.createElement('a');
            link.download = 'RedThreadStrip.png';
            link.href = exp.toDataURL();
            link.click();
        }
    </script>
</body>
</html>
