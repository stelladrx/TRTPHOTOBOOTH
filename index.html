<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>The Red Thread Photobooth</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #f2e1e1; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }

        .app-container { 
            position: relative; 
            width: 100vw; height: 100vh; 
            max-width: 430px; max-height: 932px; 
            background-color: #f2e1e1; 
        }

        .screen { display: none; position: absolute; inset: 0; }
        .active { display: block !important; }
        .bg-layer { position: absolute; width: 100%; height: 100%; object-fit: contain; z-index: 1; }

        /* CAMERA VIEWPORT */
        .camera-viewport {
            position: absolute; top: 12.5%; left: 50%; transform: translateX(-50%);
            width: 66%; height: 38.5%; overflow: hidden; background: #000; z-index: 5;
        }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

        /* PREVIEW STRIP AREA */
        .strip-preview-area {
            position: absolute; top: 4.5%; left: 50%; transform: translateX(-50%);
            width: 33.5%; height: 75%; z-index: 5;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            padding-top: 10px;
            background: white; /* Matches the strip look */
        }
        .preview-img { 
            width: 90%; height: 17.5%; margin-bottom: 5%; 
            object-fit: cover; background: #eee;
        }

        /* BUTTON HIT ZONES */
        .hitbox { position: absolute; z-index: 20; cursor: pointer; }
        #enter-btn { bottom: 5%; left: 50%; transform: translateX(-50%); width: 60%; height: 10%; }
        #start-btn { top: 58%; right: 15%; width: 25%; height: 15%; }
        #ig-btn { bottom: 21%; left: 9%; width: 22%; height: 10%; }
        #dl-btn { bottom: 6%; left: 50%; transform: translateX(-50%); width: 75%; height: 10%; }

        #timer { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            font-size: 8rem; color: white; font-weight: bold; z-index: 100; 
            text-shadow: 0 0 20px #000; pointer-events: none;
        }
        .flash { position: fixed; inset: 0; background: white; z-index: 2000; display: none; }
    </style>
</head>
<body>

    <div id="flash" class="flash"></div>

    <div class="app-container">
        <div id="screen-1" class="screen active">
            <img src="open scren.png" class="bg-layer">
            <div id="enter-btn" class="hitbox" onclick="startCamera()"></div>
        </div>

        <div id="screen-2" class="screen">
            <img src="photo screen.png" class="bg-layer">
            <div class="camera-viewport">
                <div id="timer"></div>
                <video id="video" autoplay playsinline></video>
            </div>
            <div id="start-btn" class="hitbox" onclick="takeFourPhotos()"></div>
        </div>

        <div id="screen-3" class="screen">
            <img src="strip screen.png" class="bg-layer">
            <div class="strip-preview-area" id="preview-area"></div>
            <div id="ig-btn" class="hitbox" onclick="window.location.href='https://instagram.com/theredthread.app'"></div>
            <div id="dl-btn" class="hitbox" onclick="createManualStrip()"></div>
        </div>
    </div>

    <canvas id="hidden-canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const timer = document.getElementById('timer');
        let capturedPhotos = [];

        async function startCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
            video.srcObject = stream;
            document.getElementById('screen-1').classList.remove('active');
            document.getElementById('screen-2').classList.add('active');
        }

        async function takeFourPhotos() {
            capturedPhotos = [];
            for (let i = 0; i < 4; i++) {
                await doCountdown(3);
                snap();
            }
            showResults();
        }

        function doCountdown(sec) {
            return new Promise(res => {
                let count = sec; timer.innerText = count;
                const interval = setInterval(() => {
                    count--;
                    if (count <= 0) { clearInterval(interval); timer.innerText = ""; res(); }
                    else { timer.innerText = count; }
                }, 1000);
            });
        }

        function snap() {
            document.getElementById('flash').style.display = 'block';
            setTimeout(() => document.getElementById('flash').style.display = 'none', 100);
            
            const c = document.createElement('canvas');
            c.width = 800; c.height = 800; // Square crop for the strip slots
            const ctx = c.getContext('2d');
            ctx.translate(800, 0); ctx.scale(-1, 1);
            
            // This logic ensures the "center-crop" look
            const minDim = Math.min(video.videoWidth, video.videoHeight);
            const sx = (video.videoWidth - minDim) / 2;
            const sy = (video.videoHeight - minDim) / 2;
            
            ctx.drawImage(video, sx, sy, minDim, minDim, 0, 0, 800, 800);
            capturedPhotos.push(c.toDataURL('image/jpeg', 0.9));
        }

        function showResults() {
            document.getElementById('screen-2').classList.remove('active');
            document.getElementById('screen-3').classList.add('active');
            const area = document.getElementById('preview-area');
            area.innerHTML = capturedPhotos.map(p => `<img src="${p}" class="preview-img">`).join('');
        }

        function createManualStrip() {
            const canvas = document.getElementById('hidden-canvas');
            const ctx = canvas.getContext('2d');
            
            // Final high-res strip dimensions (1:3 ratio)
            canvas.width = 1000;
            canvas.height = 3000;

            // 1. Draw the white background rectangle
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const trtLogo = new Image(); trtLogo.src = 'TRT LOGO.png';
            const textLogo = new Image(); textLogo.src = 'text logo.png';

            let loadedCount = 0;
            const photoImgs = capturedPhotos.map(src => {
                const img = new Image();
                img.src = src;
                img.onload = () => {
                    loadedCount++;
                    if (loadedCount === 4) assemble();
                };
                return img;
            });

            function assemble() {
                // 2. Draw Photos centered with padding
                const photoSize = 850;
                const x = (canvas.width - photoSize) / 2;
                
                photoImgs.forEach((img, i) => {
                    const y = 80 + (i * 680); // Calculated vertical spacing
                    ctx.drawImage(img, x, y, photoSize, 600); // Cropped height to match frame slots
                });

                // 3. Place TRT LOGO.png over the center (between photos 2 and 3)
                const trtW = 220; const trtH = 220;
                ctx.drawImage(trtLogo, (canvas.width/2) - (trtW/2), 1350, trtW, trtH);

                // 4. Place text logo.png at the bottom
                const txtW = 700; const txtH = 150;
                ctx.drawImage(textLogo, (canvas.width/2) - (txtW/2), 2750, txtW, txtH);

                // 5. Trigger Download
                const link = document.createElement('a');
                link.download = 'RedThread_Booth_Strip.jpg';
                link.href = canvas.toDataURL('image/jpeg', 0.95);
                link.click();
            }
        }
    </script>
</body>
</html>
