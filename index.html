<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Red Thread Photobooth</title>
    <style>
        :root { --booth-red: #b31d1d; }

        body, html {
            margin: 0; padding: 0;
            height: 100%; width: 100%;
            font-family: 'Helvetica Neue', sans-serif;
            background-color: #f2e1e1;
            overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }

        .screen { 
            display: none; 
            flex-direction: column; 
            align-items: center; 
            width: 100%; height: 100%; 
            position: absolute; 
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
        }
        
        .active { display: flex; }

        /* Background Design Layouts */
        #screen-start { background-image: url('open scren.png'); }
        #screen-capture { background-image: url('photo screen.png'); }
        #screen-result { background-image: url('strip screen.png'); }

        /* Live camera fit for "photo screen.png" red frame */
        .camera-container {
            position: absolute;
            top: 14.8%; /* Aligned to the red rectangle in the asset */
            width: 58.5%; 
            height: 37.5%;
            overflow: hidden;
            background: #000;
            z-index: 5;
        }

        video {
            height: 100%; width: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            filter: contrast(1.1) brightness(1.05);
        }

        #timer {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 6rem; color: white; font-weight: bold;
            text-shadow: 0 0 20px var(--booth-red);
            z-index: 10;
        }

        /* Result strip slots for "strip screen.png" */
        .results-overlay {
            position: absolute;
            top: 5%;
            width: 30%; 
            height: 61%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px 0;
            box-sizing: border-box;
            z-index: 5;
        }

        .photo-slot { width: 100%; height: 23%; overflow: hidden; }
        .photo-slot img { width: 100%; height: 100%; object-fit: cover; }

        /* --- FUNCTIONAL BUTTONS (HIT ZONES) --- */
        .hit-zone {
            position: absolute;
            cursor: pointer;
            z-index: 100;
            background: rgba(255, 0, 0, 0); /* Keep at 0 to be invisible */
        }

        /* THE ENTER BUTTON - Positioned over the ENTER asset on the start screen */
        #enter-btn {
            bottom: 6%;
            left: 50%;
            transform: translateX(-50%);
            width: 35%;
            height: 10%;
        }

        /* THE START BUTTON - Positioned over the red circle on the capture screen */
        #start-round-btn {
            top: 64.5%;
            left: 67%;
            width: 70px;
            height: 70px;
            border-radius: 50%;
        }

        /* TAG US / INSTAGRAM */
        #instagram-hit { bottom: 20%; left: 12%; width: 18%; height: 10%; }

        /* DOWNLOAD */
        #download-hit { bottom: 7%; width: 60%; height: 10%; }

        .flash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 2000; display: none; }
    </style>
</head>
<body>

    <div id="flash" class="flash"></div>

    <div id="screen-start" class="screen active">
        <div id="enter-btn" class="hit-zone" onclick="initCamera()"></div>
    </div>

    <div id="screen-capture" class="screen">
        <div class="camera-container">
            <div id="timer"></div>
            <video id="video" autoplay playsinline></video>
        </div>
        <div id="start-round-btn" class="hit-zone" onclick="runSession()"></div>
    </div>

    <div id="screen-result" class="screen">
        <div class="results-overlay">
            <div id="p1" class="photo-slot"></div>
            <div id="p2" class="photo-slot"></div>
            <div id="p3" class="photo-slot"></div>
            <div id="p4" class="photo-slot"></div>
        </div>
        
        <div id="instagram-hit" class="hit-zone" onclick="window.open('http://www.instagram.com/theredthread.app')"></div>
        <div id="download-hit" class="hit-zone" onclick="exportStrip()"></div>
        
        <button style="position:absolute; top: 2%; right: 2%; cursor:pointer; z-index: 1000;" onclick="location.reload()">RETRY</button>
    </div>

    <canvas id="hidden-canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const timer = document.getElementById('timer');
        const flash = document.getElementById('flash');
        let snaps = [];

        // FIX: Enter Button Camera Initialization
        async function initCamera() {
            try {
                // Constraints to handle mobile and desktop
                const constraints = { 
                    video: { 
                        facingMode: 'user',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    } 
                };
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                
                // Switch Screens
                document.getElementById('screen-start').classList.remove('active');
                document.getElementById('screen-capture').classList.add('active');
            } catch (err) {
                alert("Camera error: " + err.message + "\nEnsure you are using HTTPS and granted permission.");
            }
        }

        async function runSession() {
            document.getElementById('start-round-btn').style.pointerEvents = 'none';
            snaps = [];
            for (let i = 1; i <= 4; i++) {
                await countdown(3);
                triggerFlash();
                capture(i);
            }
            document.getElementById('screen-capture').classList.remove('active');
            document.getElementById('screen-result').classList.add('active');
        }

        function countdown(s) {
            return new Promise(res => {
                let count = s;
                timer.innerText = count;
                const clock = setInterval(() => {
                    count--;
                    if (count <= 0) { clearInterval(clock); timer.innerText = ""; res(); }
                    else { timer.innerText = count; }
                }, 1000);
            });
        }

        function triggerFlash() {
            flash.style.display = 'block';
            setTimeout(() => flash.style.display = 'none', 100);
        }

        function capture(index) {
            const canvas = document.getElementById('hidden-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 600; canvas.height = 800;
            ctx.translate(canvas.width, 0); ctx.scale(-1, 1);
            
            // Draw video frame to canvas
            ctx.drawImage(video, 0, 0, 600, 800);
            
            const data = canvas.toDataURL('image/png');
            snaps.push(data);
            document.getElementById('p' + index).innerHTML = `<img src="${data}">`;
            ctx.setTransform(1, 0, 0, 1, 0, 0);
        }

        async function exportStrip() {
            const exp = document.createElement('canvas');
            const ctx = exp.getContext('2d');
            exp.width = 600; exp.height = 1800;
            
            const frame = new Image();
            frame.src = 'photo strip frame.png';

            for (let i = 0; i < 4; i++) {
                const img = new Image();
                img.src = snaps[i];
                await img.decode();
                ctx.drawImage(img, 70, 95 + (i * 420), 460, 335);
            }

            try {
                await frame.decode();
                ctx.drawImage(frame, 0, 0, 600, 1800);
            } catch(e) {}
            
            const link = document.createElement('a');
            link.download = 'red-thread-strip.png';
            link.href = exp.toDataURL();
            link.click();
        }
    </script>
</body>
</html>
