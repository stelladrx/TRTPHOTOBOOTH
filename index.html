<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Red Thread Photobooth</title>
    <style>
        :root { --booth-red: #b31d1d; }

        body, html {
            margin: 0; padding: 0;
            height: 100%; width: 100%;
            font-family: 'Helvetica Neue', sans-serif;
            background-color: #f2e1e1;
            overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            touch-action: manipulation;
        }

        .screen { 
            display: none; 
            flex-direction: column; 
            align-items: center; 
            width: 100%; height: 100%; 
            position: absolute; 
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
        }
        
        .active { display: flex; }

        /* Backgrounds */
        #screen-start { background-image: url('open scren.png'); cursor: pointer; }
        #screen-capture { background-image: url('photo screen.png'); }
        #screen-result { background-image: url('strip screen.png'); }

        /* Camera */
        .camera-container {
            position: relative;
            margin-top: 18vh; 
            width: 70vw; max-width: 300px;
            aspect-ratio: 3 / 4;
            overflow: hidden;
            border-radius: 5px;
            background: #000;
            z-index: 2;
        }

        video { height: 100%; width: auto; position: absolute; left: 50%; transform: translateX(-50%) scaleX(-1); }

        #timer {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 8rem; color: white; font-weight: bold;
            text-shadow: 0 0 20px var(--booth-red);
            z-index: 10;
        }

        /* Results */
        .results-overlay {
            position: relative;
            margin-top: 6vh;
            width: 35vw; max-width: 140px;
            height: 60vh;
            display: flex; flex-direction: column;
            justify-content: space-between;
            padding: 10px 0; box-sizing: border-box;
            z-index: 2;
        }

        .photo-slot { width: 100%; height: 22%; overflow: hidden; border-radius: 2px; }
        .photo-slot img { width: 100%; height: 100%; object-fit: cover; }

        /* --- THE BUTTONS (HIT ZONES) --- */
        .hit-zone {
            position: absolute;
            cursor: pointer;
            z-index: 999; /* Make sure it's on top of everything */
            background: rgba(255, 0, 0, 0); /* Invisible */
        }

        /* Start Button - Positioned over the Red Circle on photo screen.png */
        #start-session-btn {
            bottom: 8%;
            right: 8%;
            width: 30%;
            height: 20%;
        }

        /* Instagram Button - Over the icon on strip screen.png */
        #instagram-btn {
            bottom: 20%;
            left: 12%;
            width: 18%;
            height: 10%;
        }

        /* Download Button - Over the text on strip screen.png */
        #download-btn {
            bottom: 8%;
            width: 55%;
            height: 12%;
        }

        .flash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 2000; display: none; }
    </style>
</head>
<body>

    <div id="flash" class="flash"></div>

    <div id="screen-start" class="screen active" onclick="initCamera()">
        <div style="position:absolute; bottom: 5%; color: var(--booth-red); font-size: 0.8rem;">[ Tap anywhere to start ]</div>
    </div>

    <div id="screen-capture" class="screen">
        <div class="camera-container">
            <div id="timer"></div>
            <video id="video" autoplay playsinline></video>
        </div>
        <div id="start-session-btn" class="hit-zone" onclick="runSession()"></div>
    </div>

    <div id="screen-result" class="screen">
        <div class="results-overlay">
            <div id="p1" class="photo-slot"></div>
            <div id="p2" class="photo-slot"></div>
            <div id="p3" class="photo-slot"></div>
            <div id="p4" class="photo-slot"></div>
        </div>
        
        <div id="instagram-btn" class="hit-zone" onclick="openInstagram()"></div>
        <div id="download-btn" class="hit-zone" onclick="exportStrip()"></div>
        
        <button style="position:absolute; top: 2%; right: 2%; z-index: 1000;" onclick="location.reload()">RETRY</button>
    </div>

    <canvas id="main-canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const timer = document.getElementById('timer');
        const flash = document.getElementById('flash');
        let snaps = [];

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                video.srcObject = stream;
                document.getElementById('screen-start').classList.remove('active');
                document.getElementById('screen-capture').classList.add('active');
            } catch (err) {
                alert("Please check your camera permissions!");
            }
        }

        async function runSession() {
            const btn = document.getElementById('start-session-btn');
            btn.style.pointerEvents = 'none'; // Prevent double clicking
            snaps = [];
            for (let i = 1; i <= 4; i++) {
                await countdown(3);
                triggerFlash();
                capturePhoto(i);
            }
            document.getElementById('screen-capture').classList.remove('active');
            document.getElementById('screen-result').classList.add('active');
        }

        function countdown(s) {
            return new Promise(res => {
                let count = s;
                timer.innerText = count;
                const interval = setInterval(() => {
                    count--;
                    if (count <= 0) { clearInterval(interval); timer.innerText = ""; res(); }
                    else { timer.innerText = count; }
                }, 1000);
            });
        }

        function triggerFlash() {
            flash.style.display = 'block';
            setTimeout(() => flash.style.display = 'none', 100);
        }

        function capturePhoto(index) {
            const canvas = document.getElementById('main-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 600; canvas.height = 800;
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            const scale = canvas.height / video.videoHeight;
            const xOffset = (video.videoWidth * scale - canvas.width) / 2;
            ctx.drawImage(video, -xOffset, 0, video.videoWidth * scale, canvas.height);
            snaps.push(canvas.toDataURL('image/png'));
            document.getElementById('p' + index).innerHTML = `<img src="${snaps[index-1]}">`;
            ctx.setTransform(1, 0, 0, 1, 0, 0);
        }

        function openInstagram() {
            window.open("http://www.instagram.com/theredthread.app", "_blank");
        }

        async function exportStrip() {
            const exportCanvas = document.createElement('canvas');
            const ctx = exportCanvas.getContext('2d');
            exportCanvas.width = 600; exportCanvas.height = 1800;

            const frame = new Image();
            frame.src = 'photo strip frame.png';
            
            for (let i = 0; i < 4; i++) {
                const img = new Image();
                img.src = snaps[i];
                await img.decode();
                ctx.drawImage(img, 70, 90 + (i * 418), 460, 335);
            }

            try {
                await frame.decode();
                ctx.drawImage(frame, 0, 0, 600, 1800);
            } catch(e) {}

            const link = document.createElement('a');
            link.download = 'my-red-thread-strip.png';
            link.href = exportCanvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
