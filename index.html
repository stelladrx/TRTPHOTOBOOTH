<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Red Thread Photobooth</title>
    <style>
        :root { --booth-red: #b31d1d; }

        body, html {
            margin: 0; padding: 0;
            height: 100%; width: 100%;
            font-family: 'Helvetica Neue', sans-serif;
            background-color: #f2e1e1;
            overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }

        .screen { 
            display: none; 
            flex-direction: column; 
            align-items: center; 
            width: 100%; height: 100%; 
            position: absolute; 
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
        }
        
        .active { display: flex; }

        /* DESIGNATED ASSETS */
        #screen-start { background-image: url('open scren.png'); }
        #screen-capture { background-image: url('photo screen.jpg'); }
        #screen-result { background-image: url('strip screen.jpg'); }

        /* CAMERA FIT ADJUSTMENT 
           Aligned to the inner rectangle of the 'photo screen.jpg' template
        */
        .camera-container {
            position: absolute;
            top: 13.8%; /* Adjusted for precise fit */
            width: 53.5%; 
            height: 35.8%;
            overflow: hidden;
            z-index: 5;
            background: #000;
        }

        video {
            height: 100%; width: 100%;
            object-fit: cover; /* This forces the crop to match your frame ratio */
            transform: scaleX(-1);
        }

        #timer {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 8rem; color: white; font-weight: bold;
            text-shadow: 0 0 20px var(--booth-red);
            z-index: 10;
        }

        /* STRIP RESULTS: Aligned to 'strip screen.jpg' template */
        .results-overlay {
            position: absolute;
            top: 4.5%;
            width: 31%; 
            height: 61.5%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 12px 0;
            box-sizing: border-box;
            z-index: 5;
        }

        .photo-slot { width: 100%; height: 23%; overflow: hidden; }
        .photo-slot img { width: 100%; height: 100%; object-fit: cover; }

        /* --- THE BUTTONS (HIT ZONES) --- */
        .hit-zone {
            position: absolute;
            cursor: pointer;
            z-index: 100;
            background: rgba(255, 0, 0, 0); 
        }

        /* ENTER Button - Over 'enter button.png' asset area */
        #enter-btn {
            bottom: 6%;
            width: 35%;
            height: 12%;
        }

        /* THE RED ROUND START BUTTON - Mapped to the illustration on 'photo screen.jpg' */
        #start-round-btn {
            top: 61%; /* Positioned over the red circle illustration */
            left: 65.5%;
            width: 80px;
            height: 80px;
            border-radius: 50%;
        }

        #instagram-hit { bottom: 20%; left: 10%; width: 15%; height: 10%; }
        #download-hit { bottom: 8%; width: 60%; height: 10%; }

        .flash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 2000; display: none; }
    </style>
</head>
<body>

    <div id="flash" class="flash"></div>

    <div id="screen-start" class="screen active">
        <div id="enter-btn" class="hit-zone" onclick="initCamera()"></div>
    </div>

    <div id="screen-capture" class="screen">
        <div class="camera-container">
            <div id="timer"></div>
            <video id="video" autoplay playsinline></video>
        </div>
        <div id="start-round-btn" class="hit-zone" onclick="runSession()"></div>
    </div>

    <div id="screen-result" class="screen">
        <div class="results-overlay">
            <div id="p1" class="photo-slot"></div>
            <div id="p2" class="photo-slot"></div>
            <div id="p3" class="photo-slot"></div>
            <div id="p4" class="photo-slot"></div>
        </div>
        <div id="instagram-hit" class="hit-zone" onclick="window.open('http://www.instagram.com/theredthread.app')"></div>
        <div id="download-hit" class="hit-zone" onclick="exportStrip()"></div>
        <button style="position:absolute; top: 2%; right: 2%; cursor:pointer;" onclick="location.reload()">RETRY</button>
    </div>

    <canvas id="hidden-canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const timer = document.getElementById('timer');
        const flash = document.getElementById('flash');
        let captured = [];

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                video.srcObject = stream;
                document.getElementById('screen-start').classList.remove('active');
                document.getElementById('screen-capture').classList.add('active');
            } catch (err) {
                // This handles the error from your screenshot
                alert("Camera Access Error: Ensure you are using HTTPS and have allowed camera permissions in your browser.");
            }
        }

        async function runSession() {
            document.getElementById('start-round-btn').style.pointerEvents = 'none';
            captured = [];
            for (let i = 1; i <= 4; i++) {
                await doCountdown(3);
                triggerFlash();
                snap(i);
            }
            document.getElementById('screen-capture').classList.remove('active');
            document.getElementById('screen-result').classList.add('active');
        }

        function doCountdown(s) {
            return new Promise(res => {
                let count = s;
                timer.innerText = count;
                const clock = setInterval(() => {
                    count--;
                    if (count <= 0) { clearInterval(clock); timer.innerText = ""; res(); }
                    else { timer.innerText = count; }
                }, 1000);
            });
        }

        function triggerFlash() {
            flash.style.display = 'block';
            setTimeout(() => flash.style.display = 'none', 100);
        }

        function snap(index) {
            const canvas = document.getElementById('hidden-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 600; canvas.height = 800; // Fixed ratio matching template slots
            ctx.translate(canvas.width, 0); ctx.scale(-1, 1);
            
            // Draw video frame - object-fit logic on canvas
            const scale = Math.max(canvas.width / video.videoWidth, canvas.height / video.videoHeight);
            const x = (canvas.width / 2) - (video.videoWidth / 2) * scale;
            const y = (canvas.height / 2) - (video.videoHeight / 2) * scale;
            ctx.drawImage(video, x, y, video.videoWidth * scale, video.videoHeight * scale);
            
            const data = canvas.toDataURL('image/png');
            captured.push(data);
            document.getElementById('p' + index).innerHTML = `<img src="${data}">`;
            ctx.setTransform(1, 0, 0, 1, 0, 0);
        }

        async function exportStrip() {
            const exp = document.createElement('canvas');
            const ctx = exp.getContext('2d');
            exp.width = 600; exp.height = 1800;
            
            const frame = new Image();
            frame.src = 'photo strip frame.png';

            for (let i = 0; i < 4; i++) {
                const img = new Image();
                img.src = captured[i];
                await img.decode();
                // Match the strip frame internal boxes
                ctx.drawImage(img, 72, 100 + (i * 418), 456, 332);
            }

            await frame.decode();
            ctx.drawImage(frame, 0, 0, 600, 1800);
            
            const link = document.createElement('a');
            link.download = 'RedThreadStrip.png';
            link.href = exp.toDataURL();
            link.click();
        }
    </script>
</body>
</html>
