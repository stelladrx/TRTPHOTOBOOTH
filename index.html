<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Red Thread Photobooth</title>
    <style>
        :root {
            --booth-red: #b31d1d;
        }

        body, html {
            margin: 0; padding: 0;
            height: 100%; width: 100%;
            font-family: 'Helvetica Neue', sans-serif;
            background-color: #f2e1e1;
            overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }

        /* Page Layouts using your Assets */
        .screen { 
            display: none; 
            flex-direction: column; 
            align-items: center; 
            width: 100%; height: 100%; 
            position: absolute; 
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
        }
        
        .active { display: flex; }

        /* Screen 1: Open Screen */
        #screen-start { background-image: url('open scren.png'); }

        /* Screen 2: Photo Screen */
        #screen-capture { background-image: url('photo screen.png'); }

        /* Screen 3: Strip Screen */
        #screen-result { background-image: url('strip screen.png'); }

        /* Camera Positioning (Aligned to the frame in your photo screen.png) */
        .camera-container {
            position: relative;
            margin-top: 15.5vh; /* Adjusted to fit your illustration's window */
            width: 72vw;
            max-width: 290px;
            aspect-ratio: 3 / 4;
            overflow: hidden;
            border-radius: 4px;
        }

        video {
            height: 100%; width: auto;
            position: absolute; left: 50%;
            transform: translateX(-50%) scaleX(-1);
            filter: contrast(1.1) brightness(1.05) saturate(1.1);
        }

        #timer {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 8rem; color: white; font-weight: bold;
            text-shadow: 0 0 20px var(--booth-red);
            z-index: 10;
        }

        /* Results Display (Aligned to your strip screen.png) */
        .results-overlay {
            position: relative;
            margin-top: 4.5vh;
            width: 32vw;
            max-width: 135px;
            height: 62vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px 0;
            box-sizing: border-box;
        }

        .photo-slot { width: 100%; height: 21%; overflow: hidden; }
        .photo-slot img { width: 100%; height: 100%; object-fit: cover; }

        /* Invisible clickable areas over your asset buttons */
        .hit-zone {
            position: absolute;
            cursor: pointer;
            border: none;
            background: transparent;
        }

        #enter-btn { bottom: 10%; width: 50%; height: 10%; }
        #start-session-btn { bottom: 12%; width: 30%; height: 30%; left: 60%; } /* Over the red button illustration */
        #download-hit { bottom: 5%; width: 60%; height: 8%; }
        #instagram-hit { bottom: 18%; left: 10%; width: 15%; height: 7%; }

        .flash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 1000; display: none; }
    </style>
</head>
<body>

    <div id="flash" class="flash"></div>

    <div id="screen-start" class="screen active">
        <button id="enter-btn" class="hit-zone" onclick="initCamera()"></button>
    </div>

    <div id="screen-capture" class="screen">
        <div class="camera-container">
            <div id="timer"></div>
            <video id="video" autoplay playsinline></video>
        </div>
        <button id="start-session-btn" class="hit-zone" onclick="runSession()"></button>
    </div>

    <div id="screen-result" class="screen">
        <div class="results-overlay">
            <div id="p1" class="photo-slot"></div>
            <div id="p2" class="photo-slot"></div>
            <div id="p3" class="photo-slot"></div>
            <div id="p4" class="photo-slot"></div>
        </div>
        
        <a href="http://www.instagram.com/theredthread.app" target="_blank" id="instagram-hit" class="hit-zone"></a>
        
        <button id="download-hit" class="hit-zone" onclick="exportStrip()"></button>
        
        <button style="position:absolute; top: 2%; right: 5%;" onclick="location.reload()">RETRY</button>
    </div>

    <canvas id="main-canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const timer = document.getElementById('timer');
        const flash = document.getElementById('flash');
        let snaps = [];

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } });
                video.srcObject = stream;
                document.getElementById('screen-start').classList.remove('active');
                document.getElementById('screen-capture').classList.add('active');
            } catch (err) { alert("Camera access denied."); }
        }

        async function runSession() {
            document.getElementById('start-session-btn').style.pointerEvents = 'none';
            snaps = [];
            for (let i = 1; i <= 4; i++) {
                await countdown(3);
                triggerFlash();
                capture(i);
            }
            document.getElementById('screen-capture').classList.remove('active');
            document.getElementById('screen-result').classList.add('active');
        }

        function countdown(s) {
            return new Promise(res => {
                let count = s;
                timer.innerText = count;
                const interval = setInterval(() => {
                    count--;
                    if (count <= 0) { clearInterval(interval); timer.innerText = ""; res(); }
                    else { timer.innerText = count; }
                }, 1000);
            });
        }

        function triggerFlash() {
            flash.style.display = 'block';
            setTimeout(() => flash.style.display = 'none', 100);
        }

        function capture(index) {
            const canvas = document.getElementById('main-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 600; canvas.height = 800;
            
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            ctx.filter = "contrast(1.1) brightness(1.1)";
            
            const scale = canvas.height / video.videoHeight;
            const xOffset = (video.videoWidth * scale - canvas.width) / 2;
            ctx.drawImage(video, -xOffset, 0, video.videoWidth * scale, canvas.height);
            
            const data = canvas.toDataURL('image/png');
            snaps.push(data);
            document.getElementById('p' + index).innerHTML = `<img src="${data}">`;
            ctx.setTransform(1, 0, 0, 1, 0, 0);
        }

        async function exportStrip() {
            const exportCanvas = document.createElement('canvas');
            const ctx = exportCanvas.getContext('2d');
            exportCanvas.width = 600; exportCanvas.height = 1800;

            // Use the "photo strip frame.png" for the export
            const frame = new Image();
            frame.src = 'photo strip frame.png';
            
            for (let i = 0; i < 4; i++) {
                const img = new Image();
                img.src = snaps[i];
                await img.decode();
                ctx.drawImage(img, 75, 95 + (i * 415), 450, 335);
            }

            try {
                await frame.decode();
                ctx.drawImage(frame, 0, 0, 600, 1800);
            } catch(e) {}

            const link = document.createElement('a');
            link.download = 'red-thread-strip.png';
            link.href = exportCanvas.toDataURL();
            link.click();
        }
    </script>
</body>
</html>
