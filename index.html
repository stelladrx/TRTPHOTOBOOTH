<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>The Red Thread Photobooth</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #f2e1e1; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }

        /* Essential Mobile Fix: Use dvh to prevent overflow */
        .app-container { 
            position: relative; 
            width: 100vw; 
            height: 100dvh; 
            max-width: 400px; /* Slightly narrower for better phone fit */
            max-height: 850px; 
            background-color: #f2e1e1; 
            overflow: hidden;
        }

        .screen { display: none; position: absolute; inset: 0; }
        .active { display: block !important; }
        .bg-layer { position: absolute; width: 100%; height: 100%; object-fit: contain; z-index: 1; }

        /* CAMERA VIEWPORT */
        .camera-viewport {
            position: absolute; top: 13%; left: 50%; transform: translateX(-50%);
            width: 65%; height: 37%; overflow: hidden; background: #000; z-index: 5;
        }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

        /* STRIP PREVIEW - MATCHES DOWNLOAD PROPORTIONS */
        .strip-preview-area {
            position: absolute; top: 5%; left: 50%; transform: translateX(-50%);
            width: 32%; height: 74%; z-index: 5;
            background: white; 
            display: flex; flex-direction: column; align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            padding-top: 8px;
        }
        
        .preview-photos-container {
            width: 100%; display: flex; flex-direction: column; align-items: center;
        }

        .preview-img { 
            width: 88%; height: auto; aspect-ratio: 1000 / 750;
            margin-bottom: 6%; object-fit: cover; 
        }

        .preview-trt-logo { 
            position: absolute; top: 40.5%; width: 30%; z-index: 10; 
        }

        .preview-text-logo { 
            width: 80%; margin-top: auto; padding-bottom: 12px; 
        }

        /* HIT ZONES - Adjusted for smaller mobile container */
        .hitbox { position: absolute; z-index: 20; cursor: pointer; background: rgba(0,0,0,0); }
        #enter-btn { bottom: 6%; left: 50%; transform: translateX(-50%); width: 50%; height: 8%; }
        #start-btn { top: 57%; right: 13%; width: 22%; height: 12%; border-radius: 50%; }
        #ig-btn { bottom: 22%; left: 10%; width: 25%; height: 7%; }
        #dl-btn { bottom: 7%; left: 50%; transform: translateX(-50%); width: 75%; height: 8%; }

        #timer { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            font-size: 5rem; color: white; font-weight: bold; z-index: 100; 
            text-shadow: 0 0 15px #000;
        }
        .flash { position: fixed; inset: 0; background: white; z-index: 2000; display: none; }
    </style>
</head>
<body>

    <div id="flash" class="flash"></div>

    <div class="app-container">
        <div id="screen-1" class="screen active">
            <img src="open scren.png" class="bg-layer">
            <div id="enter-btn" class="hitbox" onclick="startCamera()"></div>
        </div>

        <div id="screen-2" class="screen">
            <img src="photo screen.png" class="bg-layer">
            <div class="camera-viewport">
                <div id="timer"></div>
                <video id="video" autoplay playsinline></video>
            </div>
            <div id="start-btn" class="hitbox" onclick="takeFourPhotos()"></div>
        </div>

        <div id="screen-3" class="screen">
            <img src="strip screen.png" class="bg-layer">
            <div class="strip-preview-area" id="strip-preview">
                <div class="preview-photos-container" id="photo-list"></div>
                <img src="TRT LOGO.png" class="preview-trt-logo">
                <img src="text logo.png" class="preview-text-logo">
            </div>
            <div id="ig-btn" class="hitbox" onclick="window.location.href='https://instagram.com/theredthread.app'"></div>
            <div id="dl-btn" class="hitbox" onclick="createFinalDownload()"></div>
        </div>
    </div>

    <canvas id="hidden-canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const timer = document.getElementById('timer');
        let capturedPhotos = [];

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user' } 
                });
                video.srcObject = stream;
                document.getElementById('screen-1').classList.remove('active');
                document.getElementById('screen-2').classList.add('active');
            } catch (err) {
                alert("Please use HTTPS and allow camera access.");
            }
        }

        async function takeFourPhotos() {
            capturedPhotos = [];
            for (let i = 0; i < 4; i++) {
                await doCountdown(3);
                snap();
            }
            showResults();
        }

        function doCountdown(sec) {
            return new Promise(res => {
                let count = sec; timer.innerText = count;
                const interval = setInterval(() => {
                    count--;
                    if (count <= 0) { clearInterval(interval); timer.innerText = ""; res(); }
                    else { timer.innerText = count; }
                }, 1000);
            });
        }

        function snap() {
            document.getElementById('flash').style.display = 'block';
            setTimeout(() => document.getElementById('flash').style.display = 'none', 100);
            
            const c = document.createElement('canvas');
            c.width = 1000; c.height = 750; // Exact aspect ratio for download
            const ctx = c.getContext('2d');
            
            ctx.translate(1000, 0); ctx.scale(-1, 1);
            ctx.filter = 'contrast(1.05) brightness(1.02)';
            ctx.drawImage(video, 0, 0, 1000, 750);
            
            // Add grain texture
            for (let i = 0; i < 6000; i++) {
                ctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.03})`;
                ctx.fillRect(Math.random() * 1000, Math.random() * 750, 1, 1);
            }
            capturedPhotos.push(c.toDataURL('image/jpeg', 0.9));
        }

        function showResults() {
            document.getElementById('screen-2').classList.remove('active');
            document.getElementById('screen-3').classList.add('active');
            const list = document.getElementById('photo-list');
            list.innerHTML = capturedPhotos.map(p => `<img src="${p}" class="preview-img">`).join('');
        }

        function createFinalDownload() {
            const canvas = document.getElementById('hidden-canvas');
            const ctx = canvas.getContext('2d');
            
            // Fixed high-res dimensions
            canvas.width = 1200;
            canvas.height = 3700; 

            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const trtLogo = new Image(); trtLogo.src = 'TRT LOGO.png';
            const textLogo = new Image(); textLogo.src = 'text logo.png';

            let loaded = 0;
            const imgs = capturedPhotos.map(src => {
                const img = new Image();
                img.src = src;
                img.onload = () => { loaded++; if(loaded === 4) build(); };
                return img;
            });

            function build() {
                const photoW = 1050;
                const photoH = 787; // Matches 1000/750 ratio
                const x = (canvas.width - photoW) / 2;

                imgs.forEach((img, i) => {
                    const y = 80 + (i * 810);
                    ctx.drawImage(img, x, y, photoW, photoH);
                });

                const trtSize = 300;
                ctx.drawImage(trtLogo, (canvas.width/2)-(trtSize/2), 1545, trtSize, trtSize);

                const txtW = 900; const txtH = 180;
                ctx.drawImage(textLogo, (canvas.width/2)-(txtW/2), 3450, txtW, txtH);

                const link = document.createElement('a');
                link.download = 'TheRedThread_Strip.jpg';
                link.href = canvas.toDataURL('image/jpeg', 1.0);
                link.click();
            }
        }
    </script>
</body>
</html>
