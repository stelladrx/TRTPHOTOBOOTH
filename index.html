<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Red Thread Photobooth</title>
    <style>
        :root { --booth-red: #b31d1d; }

        /* Forces the app to behave like a mobile app */
        body, html {
            margin: 0; padding: 0;
            height: 100%; width: 100%;
            background-color: #f2e1e1;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
            font-family: sans-serif;
        }

        /* Fixed container prevents stretching background images */
        .app-container {
            position: relative;
            width: 430px; /* Standard iPhone Width */
            height: 932px; /* Standard iPhone Height */
            background-color: #f2e1e1;
            box-shadow: 0 0 50px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .screen {
            display: none;
            position: absolute;
            width: 100%; height: 100%;
            background-size: 100% 100%; /* Important: Fits your asset exactly to the 430x932 area */
            background-position: center;
            background-repeat: no-repeat;
        }
        
        .active { display: block !important; }

        /* Assigning Backgrounds - Match these exactly to your files */
        #screen-start { background-image: url('open%20scren.png'); }
        #screen-capture { background-image: url('photo%20screen.jpg'); }
        #screen-result { background-image: url('strip%20screen.jpg'); }

        /* CAMERA FIX: Fixed Pixels for L 654,5307px X H 913,1924px scaled down to fit */
        .camera-box {
            position: absolute;
            top: 130px; /* Position inside your red frame asset */
            left: 50%;
            transform: translateX(-50%);
            width: 300px; /* Your requested width scaled to fit phone screen */
            height: 420px; /* Your requested height scaled to fit phone screen */
            overflow: hidden;
            background: #000;
            z-index: 10;
            border: 4px solid var(--booth-red);
        }

        video {
            width: 100%; height: 100%;
            object-fit: cover; /* This stops the camera from stretching */
            transform: scaleX(-1);
        }

        #timer {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 8rem; color: white; font-weight: bold;
            z-index: 20; text-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        /* BUTTON HIT ZONES (Invisible click areas) */
        .hit-zone {
            position: absolute;
            cursor: pointer;
            z-index: 100;
            background: rgba(255, 0, 0, 0); /* Set to 0.3 for testing positions */
        }

        /* Click "ENTER" on home screen */
        #enter-btn { 
            bottom: 60px; left: 50%; 
            transform: translateX(-50%);
            width: 220px; height: 80px; 
        }

        /* Click RED CIRCLE on capture screen */
        #start-round-btn {
            top: 585px; right: 80px;
            width: 75px; height: 75px;
            border-radius: 50%;
        }

        .flash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 2000; display: none; }
    </style>
</head>
<body>

    <div id="flash" class="flash"></div>

    <div class="app-container">
        
        <div id="screen-start" class="screen active">
            <div id="enter-btn" class="hit-zone" onclick="initCamera()"></div>
        </div>

        <div id="screen-capture" class="screen">
            <div class="camera-box">
                <div id="timer"></div>
                <video id="video" autoplay playsinline></video>
            </div>
            <div id="start-round-btn" class="hit-zone" onclick="runSession()"></div>
        </div>

    </div>

    <script>
        const video = document.getElementById('video');
        const timer = document.getElementById('timer');
        const flash = document.getElementById('flash');

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user', aspectRatio: 0.75 } 
                });
                video.srcObject = stream;
                document.getElementById('screen-start').classList.remove('active');
                document.getElementById('screen-capture').classList.add('active');
            } catch (err) {
                alert("Camera Access Required. Use HTTPS.");
            }
        }

        function runSession() {
            let count = 3;
            timer.innerText = count;
            const clock = setInterval(() => {
                count--;
                if (count <= 0) {
                    clearInterval(clock);
                    timer.innerText = "";
                    flash.style.display = 'block';
                    setTimeout(() => flash.style.display = 'none', 100);
                    // Add logic to save photo here
                } else {
                    timer.innerText = count;
                }
            }, 1000);
        }
    </script>
</body>
</html>
