<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Red Thread Photobooth</title>
    <style>
        :root { --booth-red: #b31d1d; }

        body, html {
            margin: 0; padding: 0;
            height: 100%; width: 100%;
            font-family: 'Helvetica Neue', sans-serif;
            background-color: #f2e1e1;
            overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }

        .screen { 
            display: none; 
            flex-direction: column; 
            align-items: center; 
            width: 100%; height: 100%; 
            position: absolute; 
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
        }
        
        .active { display: flex; }

        /* DESIGNATED BACKGROUNDS */
        #screen-start { background-image: url('open scren.png'); }
        #screen-capture { background-image: url('photo screen.png'); }
        #screen-result { background-image: url('strip screen.png'); }

        /* LIVE VIEW: Adjusted to match your "like this" reference */
        .camera-container {
            position: absolute;
            top: 15.3%; /* Aligned to the inner red frame */
            width: 53.5%; /* Corrected Ratio to fit the box precisely */
            height: 34.5%;
            overflow: hidden;
            z-index: 5;
            background: #000;
        }

        video {
            height: 100%; width: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Mirror */
            filter: contrast(1.1) brightness(1.1) saturate(1.05); /* Beauty effect */
        }

        #timer {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 8rem; color: white; font-weight: bold;
            text-shadow: 0 0 20px var(--booth-red);
            z-index: 10;
        }

        /* STRIP RESULTS: Adjusted for the strip screen asset */
        .results-overlay {
            position: absolute;
            top: 5.5%;
            width: 28%; 
            height: 59.5%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 8px 0;
            box-sizing: border-box;
            z-index: 5;
        }

        .photo-slot { width: 100%; height: 23%; overflow: hidden; }
        .photo-slot img { width: 100%; height: 100%; object-fit: cover; }

        /* --- THE BUTTONS --- */
        .hit-zone {
            position: absolute;
            cursor: pointer;
            z-index: 100;
            background: rgba(255, 0, 0, 0); /* Set to 0.2 to debug position */
        }

        /* The Enter Button on "open screen.png" */
        #enter-btn {
            bottom: 7%;
            left: 50%;
            transform: translateX(-50%);
            width: 32%;
            height: 9%;
        }

        /* THE RED ROUND BUTTON: Mapped to start button.png position */
        #start-round-btn {
            top: 61.5%;
            left: 65.5%;
            width: 75px;
            height: 75px;
            border-radius: 50%;
        }

        #instagram-hit { bottom: 20%; left: 14%; width: 13%; height: 8%; }
        #download-hit { bottom: 8%; width: 52%; height: 8%; }

        .flash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 2000; display: none; }
    </style>
</head>
<body>

    <div id="flash" class="flash"></div>

    <div id="screen-start" class="screen active">
        <div id="enter-btn" class="hit-zone" onclick="initCamera()"></div>
    </div>

    <div id="screen-capture" class="screen">
        <div class="camera-container">
            <div id="timer"></div>
            <video id="video" autoplay playsinline></video>
        </div>
        <div id="start-round-btn" class="hit-zone" onclick="runSession()"></div>
    </div>

    <div id="screen-result" class="screen">
        <div class="results-overlay">
            <div id="p1" class="photo-slot"></div>
            <div id="p2" class="photo-slot"></div>
            <div id="p3" class="photo-slot"></div>
            <div id="p4" class="photo-slot"></div>
        </div>
        <div id="instagram-hit" class="hit-zone" onclick="window.open('http://www.instagram.com/theredthread.app')"></div>
        <div id="download-hit" class="hit-zone" onclick="exportStrip()"></div>
        <button style="position:absolute; top: 3%; right: 3%; cursor:pointer;" onclick="location.reload()">RETRY</button>
    </div>

    <canvas id="hidden-canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const timer = document.getElementById('timer');
        const flash = document.getElementById('flash');
        let capturedSnaps = [];

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                video.srcObject = stream;
                document.getElementById('screen-start').classList.remove('active');
                document.getElementById('screen-capture').classList.add('active');
            } catch (err) { alert("Camera Permission Required"); }
        }

        async function runSession() {
            document.getElementById('start-round-btn').style.pointerEvents = 'none';
            capturedSnaps = [];
            for (let i = 1; i <= 4; i++) {
                await countdown(3);
                triggerFlash();
                takeSnap(i);
            }
            document.getElementById('screen-capture').classList.remove('active');
            document.getElementById('screen-result').classList.add('active');
        }

        function countdown(s) {
            return new Promise(res => {
                let t = s;
                timer.innerText = t;
                const clock = setInterval(() => {
                    t--;
                    if (t <= 0) { clearInterval(clock); timer.innerText = ""; res(); }
                    else { timer.innerText = t; }
                }, 1000);
            });
        }

        function triggerFlash() {
            flash.style.display = 'block';
            setTimeout(() => flash.style.display = 'none', 100);
        }

        function takeSnap(index) {
            const canvas = document.getElementById('hidden-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 600; canvas.height = 800;
            ctx.translate(canvas.width, 0); ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0, 600, 800);
            const data = canvas.toDataURL('image/png');
            capturedSnaps.push(data);
            document.getElementById('p' + index).innerHTML = `<img src="${data}">`;
            ctx.setTransform(1, 0, 0, 1, 0, 0);
        }

        async function exportStrip() {
            const exp = document.createElement('canvas');
            const ctx = exp.getContext('2d');
            exp.width = 600; exp.height = 1800; // Final vertical strip ratio
            const frame = new Image();
            frame.src = 'photo strip frame.png';

            for (let i = 0; i < 4; i++) {
                const img = new Image();
                img.src = capturedSnaps[i];
                await img.decode();
                // Spacing adjusted for the frame template
                ctx.drawImage(img, 72, 98 + (i * 418), 455, 332);
            }

            await frame.decode();
            ctx.drawImage(frame, 0, 0, 600, 1800);
            const link = document.createElement('a');
            link.download = 'TheRedThreadStrip.png';
            link.href = exp.toDataURL();
            link.click();
        }
    </script>
</body>
</html>
