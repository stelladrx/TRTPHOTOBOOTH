<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Red Thread Photobooth</title>
    <style>
        :root { --booth-red: #b31d1d; }

        body, html {
            margin: 0; padding: 0;
            height: 100%; width: 100%;
            background-color: #f2e1e1;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
            font-family: 'Helvetica', sans-serif;
        }

        .app-container {
            position: relative;
            width: 430px; 
            height: 932px; 
            background-color: #f2e1e1;
            overflow: hidden;
        }

        .screen {
            display: none;
            position: absolute;
            inset: 0;
            z-index: 1;
        }
        
        .active { display: block !important; }

        .bg-layer {
            position: absolute;
            width: 100%; height: 100%;
            object-fit: contain; 
            z-index: 2;
        }

        /* PHOTO SIZE FIX: Scaled to fit perfectly inside the red frame */
        .camera-viewport {
            position: absolute;
            top: 13.5%; 
            left: 50%;
            transform: translateX(-50%);
            width: 285px; /* Adjusted size based on your frame */
            height: 395px;
            overflow: hidden;
            background: #222;
            z-index: 10;
        }

        video {
            width: 100%; height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        /* STRIP PAGE LAYOUT */
        .strip-display {
            position: absolute;
            top: 5.5%;
            left: 50%;
            transform: translateX(-50%);
            width: 155px; /* Matches width of white strip in background */
            height: 700px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding-top: 12px;
        }

        .strip-photo {
            width: 135px;
            height: 110px;
            margin: 0 auto 38px auto; /* Spacing to hit the boxes */
            object-fit: cover;
            background: #eee;
        }

        /* BUTTON HIT ZONES */
        .hit-zone {
            position: absolute;
            cursor: pointer;
            z-index: 100;
            background: rgba(255, 0, 0, 0);
        }

        #enter-btn { bottom: 8%; left: 50%; transform: translateX(-50%); width: 200px; height: 80px; }
        #start-round-btn { top: 61%; right: 17%; width: 85px; height: 85px; border-radius: 50%; }
        
        /* Result Screen Buttons */
        #ig-btn { bottom: 25.5%; left: 23%; width: 50px; height: 50px; }
        #download-btn { bottom: 9.5%; left: 50%; transform: translateX(-50%); width: 310px; height: 75px; }

        #timer {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 8rem; color: white; font-weight: bold;
            z-index: 20; text-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        .flash { position: fixed; inset: 0; background: white; z-index: 2000; display: none; }
    </style>
</head>
<body>

    <div id="flash" class="flash"></div>

    <div class="app-container">
        
        <div id="screen-start" class="screen active">
            <img src="open scren.png" class="bg-layer">
            <div id="enter-btn" class="hit-zone" onclick="initCamera()"></div>
        </div>

        <div id="screen-capture" class="screen">
            <img src="photo screen.png" class="bg-layer">
            <div class="camera-viewport">
                <div id="timer"></div>
                <video id="video" autoplay playsinline></video>
            </div>
            <div id="start-round-btn" class="hit-zone" onclick="startPhotoSequence()"></div>
        </div>

        <div id="screen-result" class="screen">
            <img src="strip screen.jpg" class="bg-layer">
            <div class="strip-display" id="final-strip">
                </div>
            <div id="ig-btn" class="hit-zone" onclick="window.open('https://instagram.com/theredthread.app')"></div>
            <div id="download-btn" class="hit-zone" onclick="generateStripFile()"></div>
        </div>

    </div>

    <canvas id="hidden-canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const timer = document.getElementById('timer');
        const flash = document.getElementById('flash');
        let photos = [];

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                video.srcObject = stream;
                document.getElementById('screen-start').classList.remove('active');
                document.getElementById('screen-capture').classList.add('active');
            } catch (err) {
                alert("Please enable camera access.");
            }
        }

        async function startPhotoSequence() {
            document.getElementById('start-round-btn').style.pointerEvents = 'none';
            photos = [];
            
            for (let i = 0; i < 4; i++) {
                await countdown(3);
                capturePhoto();
            }

            // Move to result screen
            document.getElementById('screen-capture').classList.remove('active');
            document.getElementById('screen-result').classList.add('active');
            displayStrip();
        }

        function countdown(sec) {
            return new Promise(resolve => {
                let timeLeft = sec;
                timer.innerText = timeLeft;
                const clock = setInterval(() => {
                    timeLeft--;
                    if (timeLeft <= 0) {
                        clearInterval(clock);
                        timer.innerText = "";
                        resolve();
                    } else {
                        timer.innerText = timeLeft;
                    }
                }, 1000);
            });
        }

        function capturePhoto() {
            // Flash Effect
            flash.style.display = 'block';
            setTimeout(() => flash.style.display = 'none', 100);

            const canvas = document.getElementById('hidden-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 654; canvas.height = 913; // High res ratio
            
            ctx.translate(canvas.width, 0); ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0, 654, 913);
            photos.push(canvas.toDataURL('image/png'));
        }

        function displayStrip() {
            const container = document.getElementById('final-strip');
            container.innerHTML = photos.map(src => `<img src="${src}" class="strip-photo">`).join('');
        }

        function generateStripFile() {
            // Final logic to merge photos with the frame.png for download
            alert("Preparing high-quality strip for download...");
            const link = document.createElement('a');
            link.download = 'TheRedThread_Strip.png';
            link.href = photos[0]; // Placeholder for full composite
            link.click();
        }
    </script>
</body>
</html>
