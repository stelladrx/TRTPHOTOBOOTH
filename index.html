<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>The Red Thread Photobooth</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #f2e1e1; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }

        .app-container { 
            position: relative; 
            height: 100dvh; 
            aspect-ratio: 9 / 19.5; 
            background-color: #f2e1e1; 
            overflow: hidden;
        }

        .screen { display: none; position: absolute; inset: 0; }
        .active { display: block !important; }
        .bg-layer { position: absolute; width: 100%; height: 100%; object-fit: contain; z-index: 1; }

        /* CAMERA VIEWPORT */
        .camera-viewport {
            position: absolute; top: 16%; left: 50%; transform: translateX(-50%);
            width: 62%; height: 35%; overflow: hidden; background: #000; z-index: 5;
            border-radius: 4px;
        }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

        /* STRIP PREVIEW - Pushed slightly higher */
        .strip-preview-area {
            position: absolute; 
            top: 8%; /* Moved up from 10% */
            left: 62%; 
            transform: translateX(-50%);
            width: 32%; 
            height: auto;
            z-index: 5;
            background: white; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 10px 0;
        }
        
        .preview-photos-container {
            width: 100%; display: flex; flex-direction: column; align-items: center;
            gap: 5px;
        }

        .preview-img { 
            width: 88%; height: auto; aspect-ratio: 1000 / 750;
            object-fit: cover; z-index: 2;
        }

        .preview-trt-logo { 
            position: absolute; top: 40.5%; width: 35%; z-index: 10; 
        }

        .preview-text-logo { 
            width: 82%; margin-top: 8px; padding-bottom: 5px; 
        }

        /* HIT ZONES - ALL MOVED HIGHER */
        .hitbox { position: absolute; z-index: 20; cursor: pointer; }
        
        #enter-btn { bottom: 12%; left: 50%; transform: translateX(-50%); width: 60%; height: 10%; }
        
        #start-btn { top: 58%; right: 14%; width: 22%; height: 12%; }
        
        /* Left side Instagram button */
        #ig-btn { top: 32%; left: 22%; transform: translateX(-50%); width: 25%; height: 10%; }
        
        /* Primary Download Button moved up */
        #dl-btn { bottom: 20%; left: 50%; transform: translateX(-50%); width: 80%; height: 8%; }
        
        /* Retake Button moved up significantly */
        #retake-btn { 
            bottom: 14%; left: 50%; transform: translateX(-50%); 
            width: 50%; height: 4%; 
            display: flex; justify-content: center; align-items: center;
            font-family: sans-serif; font-weight: bold; font-size: 11px; color: #b31d1d;
            text-decoration: underline;
            letter-spacing: 1px;
        }

        #timer { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            font-size: 5rem; color: white; font-weight: bold; z-index: 100; 
        }
        .flash { position: fixed; inset: 0; background: white; z-index: 2000; display: none; }
    </style>
</head>
<body>

    <div id="flash" class="flash"></div>

    <div class="app-container">
        <div id="screen-1" class="screen active">
            <img src="open scren.png" class="bg-layer">
            <div id="enter-btn" class="hitbox" onclick="startCamera()"></div>
        </div>

        <div id="screen-2" class="screen">
            <img src="photo screen.png" class="bg-layer">
            <div class="camera-viewport">
                <div id="timer"></div>
                <video id="video" autoplay playsinline></video>
            </div>
            <div id="start-btn" class="hitbox" onclick="takeFourPhotos()"></div>
        </div>

        <div id="screen-3" class="screen">
            <img src="strip screen.png" class="bg-layer">
            <div class="strip-preview-area">
                <div class="preview-photos-container" id="photo-list"></div>
                <img src="TRT LOGO.png" class="preview-trt-logo">
                <img src="text logo.png" class="preview-text-logo">
            </div>
            <div id="ig-btn" class="hitbox" onclick="window.location.href='https://instagram.com/theredthread.app'"></div>
            <div id="dl-btn" class="hitbox" onclick="createFinalDownload()"></div>
            <div id="retake-btn" class="hitbox" onclick="location.reload()">RETAKE PHOTOS</div>
        </div>
    </div>

    <canvas id="hidden-canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const timer = document.getElementById('timer');
        let capturedPhotos = [];

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                video.srcObject = stream;
                document.getElementById('screen-1').classList.remove('active');
                document.getElementById('screen-2').classList.add('active');
            } catch (err) { alert("Camera access required."); }
        }

        async function takeFourPhotos() {
            capturedPhotos = [];
            for (let i = 0; i < 4; i++) {
                await doCountdown(3);
                snap();
            }
            showResults();
        }

        function doCountdown(sec) {
            return new Promise(res => {
                let count = sec; timer.innerText = count;
                const clock = setInterval(() => {
                    count--;
                    if (count <= 0) { clearInterval(clock); timer.innerText = ""; res(); }
                    else { timer.innerText = count; }
                },
