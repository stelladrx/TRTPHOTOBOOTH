<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Red Thread Photobooth</title>
    <style>
        :root { --booth-red: #b31d1d; }

        body, html {
            margin: 0; padding: 0;
            height: 100%; width: 100%;
            background-color: #f2e1e1;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
            font-family: sans-serif;
        }

        /* Fixed container that forces the phone aspect ratio */
        .app-container {
            position: relative;
            width: 430px; /* iPhone Pro width */
            height: 932px; /* iPhone Pro height */
            background-color: #f2e1e1;
            overflow: hidden;
        }

        .screen {
            display: none;
            position: absolute;
            width: 100%; height: 100%;
            top: 0; left: 0;
        }
        
        .active { display: block !important; }

        /* Background Image as a Layer */
        .bg-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0; left: 0;
            object-fit: fill;
            z-index: 1;
        }

        /* CAMERA FIX: Locked to your frame position */
        .camera-box {
            position: absolute;
            top: 130px; /* Perfectly aligns with your red frame illustration */
            left: 50%;
            transform: translateX(-50%);
            width: 300px; 
            height: 420px;
            overflow: hidden;
            background: #000;
            z-index: 10;
        }

        video {
            width: 100%; height: 100%;
            object-fit: cover; /* Prevents stretching of the face */
            transform: scaleX(-1);
        }

        /* BUTTONS (HIT ZONES) */
        .hit-zone {
            position: absolute;
            cursor: pointer;
            z-index: 100;
            background: rgba(255, 0, 0, 0); /* Set to 0.3 to see them for alignment */
        }

        /* ENTER button position (Screen 1) */
        #enter-btn { bottom: 60px; left: 50%; transform: translateX(-50%); width: 220px; height: 80px; }

        /* RED START button position (Screen 2) */
        #start-round-btn { top: 585px; right: 80px; width: 75px; height: 75px; border-radius: 50%; }

        #timer {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 8rem; color: white; font-weight: bold;
            z-index: 20; text-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        .flash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 2000; display: none; }
    </style>
</head>
<body>

    <div id="flash" class="flash"></div>

    <div class="app-container">
        
        <div id="screen-start" class="screen active">
            <img src="open scren.png" class="bg-layer">
            <div id="enter-btn" class="hit-zone" onclick="initCamera()"></div>
        </div>

        <div id="screen-capture" class="screen">
            <img src="photo screen.jpg" class="bg-layer">
            <div class="camera-box">
                <div id="timer"></div>
                <video id="video" autoplay playsinline></video>
            </div>
            <div id="start-round-btn" class="hit-zone" onclick="runSession()"></div>
        </div>

    </div>

    <script>
        const video = document.getElementById('video');
        const timer = document.getElementById('timer');
        const flash = document.getElementById('flash');

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user', aspectRatio: 0.71 } 
                });
                video.srcObject = stream;
                document.getElementById('screen-start').classList.remove('active');
                document.getElementById('screen-capture').classList.add('active');
            } catch (err) {
                alert("Please ensure you are using HTTPS and have granted camera permissions.");
            }
        }

        function runSession() {
            let count = 3;
            timer.innerText = count;
            const clock = setInterval(() => {
                count--;
                if (count <= 0) {
                    clearInterval(clock);
                    timer.innerText = "";
                    flash.style.display = 'block';
                    setTimeout(() => flash.style.display = 'none', 100);
                } else {
                    timer.innerText = count;
                }
            }, 1000);
        }
    </script>
</body>
</html>
