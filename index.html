<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>The Red Thread Photobooth</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #f2e1e1; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }

        .app-container { 
            position: relative; 
            width: 100vw; height: 100vh; 
            max-width: 430px; max-height: 932px; 
            background-color: #f2e1e1; 
        }

        .screen { display: none; position: absolute; inset: 0; }
        .active { display: block !important; }
        .bg-layer { position: absolute; width: 100%; height: 100%; object-fit: contain; z-index: 1; }

        /* CAMERA VIEWPORT */
        .camera-viewport {
            position: absolute; top: 12.5%; left: 50%; transform: translateX(-50%);
            width: 66%; height: 38.5%; overflow: hidden; background: #000; z-index: 5;
        }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

        /* STRIP PREVIEW AREA */
        .strip-preview-area {
            position: absolute; top: 4.5%; left: 50%; transform: translateX(-50%);
            width: 32%; height: 75%; z-index: 5;
            background: white; 
            display: flex; flex-direction: column; align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .preview-photos-container {
            width: 100%; height: 100%; 
            display: flex; flex-direction: column; align-items: center;
            padding-top: 12px; position: relative;
        }
        .preview-img { width: 88%; height: 18.5%; margin-bottom: 5%; object-fit: cover; z-index: 2; }
        
        /* Logos on preview to match download */
        .preview-trt { position: absolute; top: 41%; width: 30%; z-index: 10; }
        .preview-text { width: 80%; margin-top: auto; padding-bottom: 15px; z-index: 10; }

        /* HIT ZONES */
        .hitbox { position: absolute; z-index: 20; cursor: pointer; }
        #enter-btn { bottom: 5%; left: 50%; transform: translateX(-50%); width: 60%; height: 10%; }
        #start-btn { top: 58%; right: 15%; width: 25%; height: 15%; }
        #ig-btn { bottom: 21%; left: 9%; width: 22%; height: 10%; }
        #dl-btn { bottom: 6%; left: 50%; transform: translateX(-50%); width: 75%; height: 10%; }

        #timer { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            font-size: 8rem; color: white; font-weight: bold; z-index: 100; 
            text-shadow: 0 0 20px #000; pointer-events: none;
        }
        .flash { position: fixed; inset: 0; background: white; z-index: 2000; display: none; }
    </style>
</head>
<body>

    <div id="flash" class="flash"></div>

    <div class="app-container">
        <div id="screen-1" class="screen active">
            <img src="open scren.png" class="bg-layer">
            <div id="enter-btn" class="hitbox" onclick="startCamera()"></div>
        </div>

        <div id="screen-2" class="screen">
            <img src="photo screen.png" class="bg-layer">
            <div class="camera-viewport">
                <div id="timer"></div>
                <video id="video" autoplay playsinline></video>
            </div>
            <div id="start-btn" class="hitbox" onclick="takeFourPhotos()"></div>
        </div>

        <div id="screen-3" class="screen">
            <img src="strip screen.png" class="bg-layer">
            <div class="strip-preview-area" id="strip-preview">
                <div class="preview-photos-container" id="photo-list"></div>
                <img src="TRT LOGO.png" class="preview-trt">
                <img src="text logo.png" class="preview-text">
            </div>
            <div id="ig-btn" class="hitbox" onclick="window.location.href='https://instagram.com/theredthread.app'"></div>
            <div id="dl-btn" class="hitbox" onclick="createFinalDownload()"></div>
        </div>
    </div>

    <canvas id="hidden-canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const timer = document.getElementById('timer');
        let capturedPhotos = [];

        async function startCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
            video.srcObject = stream;
            document.getElementById('screen-1').classList.remove('active');
            document.getElementById('screen-2').classList.add('active');
        }

        async function takeFourPhotos() {
            capturedPhotos = [];
            for (let i = 0; i < 4; i++) {
                await doCountdown(3);
                snap();
            }
            showResults();
        }

        function doCountdown(sec) {
            return new Promise(res => {
                let count = sec; timer.innerText = count;
                const interval = setInterval(() => {
                    count--;
                    if (count <= 0) { clearInterval(interval); timer.innerText = ""; res(); }
                    else { timer.innerText = count; }
                }, 1000);
            });
        }

        function snap() {
            document.getElementById('flash').style.display = 'block';
            setTimeout(() => document.getElementById('flash').style.display = 'none', 100);
            
            const c = document.createElement('canvas');
            c.width = 1000; c.height = 750;
            const ctx = c.getContext('2d');
            ctx.translate(1000, 0); ctx.scale(-1, 1);
            
            // Grainy Filter
            ctx.filter = 'contrast(1.05) brightness(1.02)';
            ctx.drawImage(video, 0, 0, 1000, 750);
            
            // Texture
            for (let i = 0; i < 8000; i++) {
                ctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.04})`;
                ctx.fillRect(Math.random() * 1000, Math.random() * 750, 1, 1);
            }
            capturedPhotos.push(c.toDataURL('image/jpeg', 0.9));
        }

        function showResults() {
            document.getElementById('screen-2').classList.remove('active');
            document.getElementById('screen-3').classList.add('active');
            const list = document.getElementById('photo-list');
            list.innerHTML = capturedPhotos.map(p => `<img src="${p}" class="preview-img">`).join('');
        }

        function createFinalDownload() {
            const canvas = document.getElementById('hidden-canvas');
            const ctx = canvas.getContext('2d');
            
            // SHORTER LENGTH: Optimized for 4 photos + logos
            canvas.width = 1200;
            canvas.height = 3800; 

            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const trtLogo = new Image(); trtLogo.src = 'TRT LOGO.png';
            const textLogo = new Image(); textLogo.src = 'text logo.png';

            let loaded = 0;
            const imgs = capturedPhotos.map(src => {
                const img = new Image();
                img.src = src;
                img.onload = () => { loaded++; if(loaded === 4) build(); };
                return img;
            });

            function build() {
                const photoW = 1050;
                const photoH = 750;
                const x = (canvas.width - photoW) / 2;

                // Draw Photos
                imgs.forEach((img, i) => {
                    const y = 80 + (i * 800);
                    ctx.drawImage(img, x, y, photoW, photoH);
                });

                // TRT LOGO (Center overlap)
                const trtSize = 320;
                ctx.drawImage(trtLogo, (canvas.width/2)-(trtSize/2), 1540, trtSize, trtSize);

                // Text Logo (Bottom)
                const txtW = 950; const txtH = 200;
                ctx.drawImage(textLogo, (canvas.width/2)-(txtW/2), 3480, txtW, txtH);

                const link = document.createElement('a');
                link.download = 'RedThread_Booth_Strip.jpg';
                link.href = canvas.toDataURL('image/jpeg', 1.0);
                link.click();
            }
        }
    </script>
</body>
</html>
