<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Red Thread Photobooth</title>
    <style>
        :root { --booth-red: #b31d1d; }

        body, html {
            margin: 0; padding: 0;
            height: 100%; width: 100%;
            background-color: #f2e1e1;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }

        /* Fixed container to prevent stretching */
        .app-container {
            position: relative;
            width: 430px; 
            height: 932px; 
            background-color: #f2e1e1;
            overflow: hidden;
        }

        .screen {
            display: none;
            position: absolute;
            inset: 0;
            z-index: 1;
        }
        
        .active { display: block !important; }

        .bg-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: contain; 
            z-index: 2;
        }

        /* CAMERA: Centered in your red box illustration */
        .camera-viewport {
            position: absolute;
            top: 15.5%; 
            left: 50%;
            transform: translateX(-50%);
            width: 285px; 
            height: 385px;
            overflow: hidden;
            background: #222;
            z-index: 10;
            /* Optional: border removed to blend with your drawing */
        }

        video {
            width: 100%; height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        /* INVISIBLE BUTTONS */
        .hit-zone {
            position: absolute;
            cursor: pointer;
            z-index: 100;
            background: rgba(255, 0, 0, 0); /* Set to 0.3 for alignment testing */
        }

        /* Home Screen ENTER */
        #enter-btn { 
            bottom: 8%; left: 50%; 
            transform: translateX(-50%); 
            width: 200px; height: 80px; 
        }

        /* Capture Screen RED START BUTTON (aligned to your blue circle note) */
        #start-round-btn { 
            top: 61%; 
            right: 17%; 
            width: 85px; 
            height: 85px; 
            border-radius: 50%; 
        }

        #timer {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 8rem; color: white; font-weight: bold;
            z-index: 20; text-shadow: 0 0 20px rgba(0,0,0,0.7);
        }

        .flash { position: fixed; inset: 0; background: white; z-index: 2000; display: none; }
    </style>
</head>
<body>

    <div id="flash" class="flash"></div>

    <div class="app-container">
        
        <div id="screen-start" class="screen active">
            <img src="open scren.png" class="bg-layer">
            <div id="enter-btn" class="hit-zone" onclick="initCamera()"></div>
        </div>

        <div id="screen-capture" class="screen">
            <img src="photo screen.png" class="bg-layer">
            <div class="camera-viewport">
                <div id="timer"></div>
                <video id="video" autoplay playsinline></video>
            </div>
            <div id="start-round-btn" class="hit-zone" onclick="runSession()"></div>
        </div>

    </div>

    <script>
        const video = document.getElementById('video');
        const timer = document.getElementById('timer');

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user' } 
                });
                video.srcObject = stream;
                document.getElementById('screen-start').classList.remove('active');
                document.getElementById('screen-capture').classList.add('active');
            } catch (err) {
                alert("Camera access denied. Please use HTTPS.");
            }
        }

        function runSession() {
            let count = 3;
            timer.innerText = count;
            const clock = setInterval(() => {
                count--;
                if (count <= 0) {
                    clearInterval(clock);
                    timer.innerText = "";
                    document.getElementById('flash').style.display = 'block';
                    setTimeout(() => { document.getElementById('flash').style.display = 'none'; }, 100);
                } else {
                    timer.innerText = count;
                }
            }, 1000);
        }
    </script>
</body>
</html>
