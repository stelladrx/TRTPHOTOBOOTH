<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>The Red Thread Photobooth</title>
    <style>
        * { box-sizing: border-box; }
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #f2e1e1; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }

        /* Container scales to fit ANY phone screen perfectly */
        .app-container { 
            position: relative; 
            width: 100%; height: 100%; 
            max-width: 430px; max-height: 932px; 
            background-color: #f2e1e1; 
        }

        .screen { display: none; position: absolute; inset: 0; }
        .active { display: block !important; }
        .bg-layer { position: absolute; width: 100%; height: 100%; object-fit: contain; z-index: 1; }

        /* Camera Viewport - Perfectly centered in the red frame */
        .camera-viewport {
            position: absolute; top: 12.5%; left: 50%; transform: translateX(-50%);
            width: 66%; height: 38.5%; overflow: hidden; background: #000; z-index: 5;
            border: 2px solid transparent;
        }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

        /* Strip Preview - Matches the white strip in strip screen.png */
        .strip-overlay {
            position: absolute; top: 5%; left: 50%; transform: translateX(-50%);
            width: 33%; height: 75%; z-index: 5;
            display: flex; flex-direction: column; align-items: center; padding-top: 10px;
        }
        .preview-img { width: 88%; height: 18%; margin-bottom: 5.5%; object-fit: cover; background: #fff; }

        /* Invisible Hit Zones for Buttons */
        .hitbox { position: absolute; z-index: 20; cursor: pointer; background: rgba(0,0,0,0); }
        #enter-btn { bottom: 5%; left: 50%; transform: translateX(-50%); width: 60%; height: 10%; }
        #start-btn { top: 58%; right: 12%; width: 25%; height: 15%; border-radius: 50%; }
        #ig-btn { bottom: 22%; left: 10%; width: 25%; height: 10%; }
        #dl-btn { bottom: 6%; left: 50%; transform: translateX(-50%); width: 80%; height: 10%; }

        #timer { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 8rem; color: white; font-weight: bold; z-index: 100; text-shadow: 0 0 20px #000; }
        .flash { position: fixed; inset: 0; background: white; z-index: 2000; display: none; }
    </style>
</head>
<body>

    <div id="flash" class="flash"></div>

    <div class="app-container">
        <div id="screen-1" class="screen active">
            <img src="open scren.png" class="bg-layer">
            <div id="enter-btn" class="hitbox" onclick="startCamera()"></div>
        </div>

        <div id="screen-2" class="screen">
            <img src="photo screen.png" class="bg-layer">
            <div class="camera-viewport">
                <div id="timer"></div>
                <video id="video" autoplay playsinline></video>
            </div>
            <div id="start-btn" class="hitbox" onclick="takeFourPhotos()"></div>
        </div>

        <div id="screen-3" class="screen">
            <img src="strip screen.png" class="bg-layer">
            <div class="strip-overlay" id="preview-area"></div>
            <div id="ig-btn" class="hitbox" onclick="location.href='https://www.instagram.com/theredthread.app/'"></div>
            <div id="dl-btn" class="hitbox" onclick="generateDownload()"></div>
        </div>
    </div>

    <canvas id="hidden-canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const timer = document.getElementById('timer');
        let capturedPhotos = [];

        async function startCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
            video.srcObject = stream;
            document.getElementById('screen-1').classList.remove('active');
            document.getElementById('screen-2').classList.add('active');
        }

        async function takeFourPhotos() {
            capturedPhotos = [];
            for (let i = 0; i < 4; i++) {
                await doCountdown(3);
                snap();
            }
            showResults();
        }

        function doCountdown(sec) {
            return new Promise(res => {
                let count = sec;
                timer.innerText = count;
                const interval = setInterval(() => {
                    count--;
                    if (count <= 0) { clearInterval(interval); timer.innerText = ""; res(); }
                    else { timer.innerText = count; }
                }, 1000);
            });
        }

        function snap() {
            document.getElementById('flash').style.display = 'block';
            setTimeout(() => document.getElementById('flash').style.display = 'none', 100);
            
            const c = document.createElement('canvas');
            c.width = 600; c.height = 600; // Square-ish crop to fit frame better
            const ctx = c.getContext('2d');
            ctx.translate(600, 0); ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0, 600, 600);
            capturedPhotos.push(c.toDataURL('image/jpeg'));
        }

        function showResults() {
            document.getElementById('screen-2').classList.remove('active');
            document.getElementById('screen-3').classList.add('active');
            const area = document.getElementById('preview-area');
            area.innerHTML = capturedPhotos.map(p => `<img src="${p}" class="preview-img">`).join('');
        }

        function generateDownload() {
            const canvas = document.getElementById('hidden-canvas');
            const ctx = canvas.getContext('2d');
            const frame = new Image();
            frame.src = 'photo strip frame.png';

            frame.onload = () => {
                // IMPORTANT: Set canvas to the EXACT size of your frame asset
                canvas.width = frame.width;
                canvas.height = frame.height;

                let imagesLoaded = 0;
                const photoImages = capturedPhotos.map((src, i) => {
                    const img = new Image();
                    img.src = src;
                    img.onload = () => {
                        imagesLoaded++;
                        if (imagesLoaded === 4) {
                            // Draw photos behind the frame
                            // These coordinates are calculated based on a standard 1200x3600 strip
                            // Adjusting based on your 'wrong' screenshot (Photos were too small)
                            photoImages.forEach((pImg, idx) => {
                                const yPos = (canvas.height * 0.05) + (idx * (canvas.height * 0.195));
                                const xPos = canvas.width * 0.1;
                                const pWidth = canvas.width * 0.8;
                                const pHeight = canvas.height * 0.16;
                                ctx.drawImage(pImg, xPos, yPos, pWidth, pHeight);
                            });

                            // Draw the frame ON TOP
                            ctx.drawImage(frame, 0, 0);

                            // Download
                            const link = document.createElement('a');
                            link.download = 'My_Red_Thread_Strip.jpg';
                            link.href = canvas.toDataURL('image/jpeg', 0.9);
                            link.click();
                        }
                    };
                    return img;
                });
            };
        }
    </script>
</body>
</html>
